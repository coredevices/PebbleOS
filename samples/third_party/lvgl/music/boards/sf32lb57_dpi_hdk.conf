# The AMOLED add-on has a touchscreen.
CONFIG_TOUCH=y
# The flash driver moves the boot flash to four-line reads: the artwork is read in place.
CONFIG_FLASH=y
# An RGB565 frame in the external RAM, which LVGL renders straight into.
CONFIG_RAM=y
CONFIG_DISPLAY_SF32LB57_LCDC_FORMAT_RGB565=y
# The accelerator of the SoC draws what it can.
CONFIG_GPU=y
# A second frame in the external RAM, rendered while the first is sent.
CONFIG_SCRATCH_HEAP_SHARED=n
