# Firmware settings for the asterix board, normal variant.

# The LSM6DSO has a higher noise floor than the accelerometers the activity
# thresholds were tuned for.
CONFIG_SERVICE_ACTIVITY_SLEEP_MAX_MINUTE_SCORE=500
CONFIG_SERVICE_ACTIVITY_SLEEP_MIN_VALID_VMC=30
CONFIG_SERVICE_ACTIVITY_SLEEP_MAX_AVG_VMC=250
CONFIG_SERVICE_ACTIVITY_NOT_WORN_MIN_WORN_VMC=15
# Longer stillness during deep sleep, still catching time on a desk.
CONFIG_SERVICE_ACTIVITY_NOT_WORN_MAX_LOW_VMC_RUN_M=120
