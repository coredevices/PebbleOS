# Firmware settings for the getafix board.

CONFIG_ALS_SCREEN_COMPENSATION=y
# Upper-right edge; black_scale ~25x from `als curve`.
CONFIG_ALS_SENSOR_X=200
CONFIG_ALS_SENSOR_Y=70
CONFIG_ALS_SENSOR_W=40
CONFIG_ALS_SENSOR_H=40
CONFIG_ALS_BLACK_SCALE_Q8=6400

CONFIG_BATTERY_WARNING_FIRST_PERCENT=12
CONFIG_BATTERY_WARNING_SECOND_PERCENT=8

CONFIG_DYNAMIC_BACKLIGHT=y
CONFIG_BACKLIGHT_STANDARD_INTENSITY=25
CONFIG_ACCEL_SENSITIVITY=y
CONFIG_APP_SCALING=y
CONFIG_ORIENTATION_MANAGER=y
CONFIG_MODDABLE_XS=y

CONFIG_SERVICE_LIGHT_BACKLIGHT_ON_PERCENT=25
CONFIG_SERVICE_LIGHT_DARK_THRESHOLD=800
CONFIG_SERVICE_LIGHT_DARK_THRESHOLD_DELTA=100
CONFIG_SERVICE_BATTERY_LOW_POWER_PERCENT=5
CONFIG_SERVICE_BATTERY_CAPACITY_HOURS=150
