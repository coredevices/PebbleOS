%YAML 1.2
---
$id: http://devicetree.org/schemas/display/sifli,sf32lb52-lcdc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 LCD controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Display controller scanning out to a panel, here on the JDI parallel
  interface, connected through its port.

properties:
  compatible:
    const: sifli,sf32lb52-lcdc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  pinctrl-0: true
  pinctrl-1: true

  pinctrl-names:
    description:
      The sleep state, if any, holds the panel inputs while the panel is power
      cycled.
    minItems: 1
    items:
      - const: default
      - const: sleep

  port:
    $ref: /schemas/graph.yaml#/properties/port
    description: Output to the panel.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - port

additionalProperties: false

examples:
  - |
    display-controller@50008000 {
        compatible = "sifli,sf32lb52-lcdc";
        reg = <0x50008000 0x1000>;
        interrupts = <63>;
        clocks = <&hpsys_rcc 6>;
        resets = <&hpsys_rcc 7>;

        port {
            endpoint {
                remote-endpoint = <&panel_in>;
            };
        };
    };
