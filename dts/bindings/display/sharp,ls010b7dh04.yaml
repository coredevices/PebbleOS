%YAML 1.2
---
$id: http://devicetree.org/schemas/display/sharp,ls010b7dh04.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sharp Memory LCD panels

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Monochrome SPI panels that keep their image in pixel memory, as in Linux,
  with the LS013B7DH01 added. VCOM is inverted to prevent a DC bias, by the
  driver over SPI (software), by an external signal (external), or by a PWM
  output on EXTCOMIN (pwm).

allOf:
  - $ref: panel/panel-common.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - if:
      properties:
        sharp,vcom-mode:
          const: pwm
    then:
      required:
        - pwms

properties:
  compatible:
    enum:
      - sharp,ls010b7dh04
      - sharp,ls011b7dh03
      - sharp,ls012b7dd01
      - sharp,ls013b7dh01
      - sharp,ls013b7dh03
      - sharp,ls013b7dh05
      - sharp,ls018b7dh02
      - sharp,ls027b7dh01
      - sharp,ls027b7dh01a
      - sharp,ls032b7dd02
      - sharp,ls044q7dh01

  reg:
    maxItems: 1

  spi-max-frequency:
    maximum: 2000000

  sharp,vcom-mode:
    $ref: /schemas/types.yaml#/definitions/string
    enum: [software, external, pwm]
    description: How VCOM is inverted.

  enable-gpios: true

  pwms:
    maxItems: 1
    description: External VCOM signal.

required:
  - compatible
  - reg
  - sharp,vcom-mode

unevaluatedProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        display@0 {
            compatible = "sharp,ls013b7dh01";
            reg = <0>;
            spi-cs-high;
            spi-max-frequency = <1000000>;
            sharp,vcom-mode = "pwm";
            pwms = <&rtc2_pwm 0 8333333 0>;
        };
    };
