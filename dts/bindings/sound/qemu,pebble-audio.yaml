%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/qemu,pebble-audio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QEMU Pebble audio output

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Playback device of the QEMU Pebble machines, fed through a FIFO and played
  on the host.

properties:
  compatible:
    const: qemu,pebble-audio

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - "#sound-dai-cells"

additionalProperties: false

examples:
  - |
    audio-controller@40012000 {
        compatible = "qemu,pebble-audio";
        reg = <0x40012000 0x1000>;
        interrupts = <10>;
        #sound-dai-cells = <0>;
    };
