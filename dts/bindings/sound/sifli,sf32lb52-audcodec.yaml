%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/sifli,sf32lb52-audcodec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 and SF32LB57 audio codec

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  The audio codec of the SF32LB52 and SF32LB57: a DAC, with its analog bias,
  PLL and output stage, and ADCs for analog microphones, powered from its
  microphone bias. Each channel streams through a DMA channel of its own: the
  DAC through tx, the first and second ADC through rx1 and rx2.

  It has two DAIs, selected by the cell of sound-dai: 0 for the DAC, 1 for
  the ADCs.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    enum:
      - sifli,sf32lb52-audcodec
      - sifli,sf32lb57-audcodec

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  dmas:
    minItems: 1
    maxItems: 3

  dma-names:
    minItems: 1
    items:
      - const: tx
      - const: rx1
      - const: rx2

  "#sound-dai-cells":
    const: 1

  sifli,pmuc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMUC, holding the HXT48 buffer to the codec.

required:
  - compatible
  - reg
  - clocks
  - "#sound-dai-cells"
  - sifli,pmuc

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/dma/sifli,sf32lb52-dmac.h>
    audio-codec@50088000 {
        compatible = "sifli,sf32lb52-audcodec";
        reg = <0x50088000 0x1000>;
        clocks = <&hpsys_rcc 33>;
        dmas = <&dmac1 3 SF32LB52_DMAC1_REQ_AUDCODEC_DAC0 SF32LB52_DMA_PRIO_HIGH>;
        dma-names = "tx";
        #sound-dai-cells = <1>;
        sifli,pmuc = <&pmuc>;
    };
