%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/sifli,sf32lb52-audcodec.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 audio codec

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  The audio codec of the SF32LB52, here its DAC, with its analog bias, PLL and
  output stage, fed through a DMA channel.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-audcodec

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  dmas:
    maxItems: 1

  dma-names:
    const: tx

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    audio-codec@50088000 {
        compatible = "sifli,sf32lb52-audcodec";
        reg = <0x50088000 0x1000>;
        clocks = <&hpsys_rcc 33>;
        dmas = <&dmac1 3 41 2>;
        dma-names = "tx";
        #sound-dai-cells = <0>;
    };
