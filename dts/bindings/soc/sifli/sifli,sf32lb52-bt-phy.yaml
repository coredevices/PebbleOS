%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/sifli/sifli,sf32lb52-bt-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 and SF32LB57 Bluetooth PHY

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Bluetooth modem in LPSYS, and the window its samples are captured through,
  which the radio calibration reads by DMA.

properties:
  compatible:
    items:
      - enum:
          - sifli,sf32lb52-bt-phy
          - sifli,sf32lb57-bt-phy
      - const: syscon

  reg:
    items:
      - description: Registers
      - description: Sample capture window

  reg-names:
    items:
      - const: regs
      - const: capture

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@40084000 {
        compatible = "sifli,sf32lb52-bt-phy", "syscon";
        reg = <0x40084000 0x1000>, <0x400c0000 0x1000>;
        reg-names = "regs", "capture";
    };
