%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/sifli/sifli,sf32lb52-hpsys-cfg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 HPSYS configuration

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  System configuration registers of the SF32LB52 HPSYS, which other blocks
  use, as the voltage mode and memory timings of the HPSYS, the HPSYS bandgap
  of the DLLs, peripheral pin routing and the chip identification.

properties:
  compatible:
    items:
      - const: sifli,sf32lb52-hpsys-cfg
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@5000b000 {
        compatible = "sifli,sf32lb52-hpsys-cfg", "syscon";
        reg = <0x5000b000 0x1000>;
    };
