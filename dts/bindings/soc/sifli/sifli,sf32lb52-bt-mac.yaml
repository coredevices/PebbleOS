%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/sifli/sifli,sf32lb52-bt-mac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 Bluetooth controller registers

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Registers of the Bluetooth controller in LPSYS, which the LCPU runs. Other
  blocks use its RC oscillator calibration counter, which counts LPSYS clock
  cycles over a number of LRC10 cycles.

properties:
  compatible:
    items:
      - enum:
          - sifli,sf32lb52-bt-mac
          - sifli,sf32lb57-bt-mac
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@40090000 {
        compatible = "sifli,sf32lb52-bt-mac", "syscon";
        reg = <0x40090000 0x1000>;
    };
