%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/sifli/sifli,sf32lb52-bt-rfc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 Bluetooth RF controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Bluetooth RF controller in LPSYS. Its sequencer command and calibration
  memory comes first, its registers follow at offset 0x800. The HCPU
  calibrates the radio through it before the LCPU boots.

properties:
  compatible:
    items:
      - const: sifli,sf32lb52-bt-rfc
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@40082000 {
        compatible = "sifli,sf32lb52-bt-rfc", "syscon";
        reg = <0x40082000 0x1000>;
    };
