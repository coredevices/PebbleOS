%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/sifli/sifli,sf32lb52-aon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 always-on power and wakeup control

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Always-on registers of the SF32LB52 HPSYS and LPSYS, which other blocks
  use, as the power mode and wakeup sources of each subsystem, the requests
  between them and the oscillators they ask for.

properties:
  compatible:
    items:
      - enum:
          - sifli,sf32lb52-hpsys-aon
          - sifli,sf32lb52-lpsys-aon
          - sifli,sf32lb57-hpsys-aon
          - sifli,sf32lb57-lpsys-aon
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@500c0000 {
        compatible = "sifli,sf32lb52-hpsys-aon", "syscon";
        reg = <0x500c0000 0x1000>;
    };
