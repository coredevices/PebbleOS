%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/st/st,stm32h747-pwr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32H747 power control

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Power control (PWR) of the STM32H745, STM32H747, STM32H755 and STM32H757,
  whose core domain is supplied by an internal LDO, an internal step-down
  converter (SMPS), both, or an external source. How the board wires VCAP,
  VDDLDO and VFBSMPS fixes which. The setting can only be written once per
  power-on, and one that does not match the board stalls the core supply.

properties:
  compatible:
    const: st,stm32h747-pwr

  reg:
    maxItems: 1

  st,supply-config:
    $ref: /schemas/types.yaml#/definitions/string
    description: |
      Supply configuration of the core domain, as wired on the board:
        ldo: the LDO supplies VCORE, the SMPS is off
        direct-smps: the SMPS supplies VCORE, the LDO is off
        smps-1v8-ldo, smps-2v5-ldo: the SMPS supplies the LDO at 1.8 V or 2.5 V
        smps-1v8-ext-ldo, smps-2v5-ext-ldo: the same, the SMPS also supplying
          external circuits
        smps-1v8-ext-bypass, smps-2v5-ext-bypass: the SMPS supplies external
          circuits at 1.8 V or 2.5 V, VCORE comes from an external source
        bypass: VCORE comes from an external source, the LDO and SMPS are off
    enum:
      - ldo
      - direct-smps
      - smps-1v8-ldo
      - smps-2v5-ldo
      - smps-1v8-ext-ldo
      - smps-2v5-ext-ldo
      - smps-1v8-ext-bypass
      - smps-2v5-ext-bypass
      - bypass

required:
  - compatible
  - reg
  - st,supply-config

additionalProperties: false

examples:
  - |
    power-config@58024800 {
        compatible = "st,stm32h747-pwr";
        reg = <0x58024800 0x400>;
        st,supply-config = "direct-smps";
    };
