%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf52832-gpiote.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF52 GPIO tasks and events (GPIOTE)

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Turns the state changes of pins into events, and drives pins from tasks, on
  a number of channels each bound to a pin. Its interrupt is the one the pins
  of the GPIO ports raise.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf52832-gpiote
      - items:
          - enum:
              - nordic,nrf52833-gpiote
              - nordic,nrf52840-gpiote
          - const: nordic,nrf52832-gpiote

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    gpiote@40006000 {
        compatible = "nordic,nrf52840-gpiote", "nordic,nrf52832-gpiote";
        reg = <0x40006000 0x1000>;
        interrupts = <6>;
    };
