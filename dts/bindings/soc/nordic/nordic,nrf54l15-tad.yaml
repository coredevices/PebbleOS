%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf54l15-tad.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L trace and debug control

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Powers and clocks the debug and trace logic of the cores.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf54l15-tad
      - items:
          - const: nordic,nrf54lm20a-tad
          - const: nordic,nrf54l15-tad

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    node@50053000 {
        compatible = "nordic,nrf54l15-tad";
        reg = <0x50053000 0x1000>;
    };
