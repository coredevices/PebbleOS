%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf54lm20a-vregusb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54LM20A USB regulator

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Regulator of the USB PHY, which VBUS powers, and which reports VBUS
  coming and going.

properties:
  compatible:
    const: nordic,nrf54lm20a-vregusb

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    regulator@50121000 {
        compatible = "nordic,nrf54lm20a-vregusb";
        reg = <0x50121000 0x1000>;
        interrupts = <289>;
    };
