%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf54l15-uicr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L user information configuration registers

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Non-volatile registers the user programs, as the access port protection.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf54l15-uicr
      - items:
          - const: nordic,nrf54lm20a-uicr
          - const: nordic,nrf54l15-uicr

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    node@ffd000 {
        compatible = "nordic,nrf54l15-uicr";
        reg = <0xffd000 0x1000>;
    };
