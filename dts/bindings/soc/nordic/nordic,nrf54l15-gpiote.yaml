%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf54l15-gpiote.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L GPIO tasks and events (GPIOTE)

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Turns the state changes of the pins of the GPIO port of its power domain into events, on a number of channels each bound to a pin. Its interrupt is the one of the secure application core.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf54l15-gpiote
      - items:
          - const: nordic,nrf54lm20a-gpiote
          - const: nordic,nrf54l15-gpiote

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  nordic,num-channels:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 8
    description: Number of channels, 8 on GPIOTE20 and 4 on GPIOTE30.

required:
  - compatible
  - reg
  - interrupts
  - nordic,num-channels

additionalProperties: false

examples:
  - |
    node@500da000 {
        compatible = "nordic,nrf54l15-gpiote";
        reg = <0x500da000 0x1000>;
        interrupts = <219>;
        nordic,num-channels = <8>;
    };
