%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf54l15-radio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L radio

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  The 2.4 GHz radio, for Bluetooth LE and IEEE 802.15.4, with two interrupt
  lines. The radio protocol stack drives it.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf54l15-radio
      - items:
          - const: nordic,nrf54lm20a-radio
          - const: nordic,nrf54l15-radio

  reg:
    maxItems: 1

  interrupts:
    maxItems: 2

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    radio@5008a000 {
        compatible = "nordic,nrf54l15-radio";
        reg = <0x5008a000 0x1000>;
        interrupts = <138>, <139>;
    };
