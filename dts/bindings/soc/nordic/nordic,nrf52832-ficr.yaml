%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf52832-ficr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF52 factory information configuration registers

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Read-only registers the factory programs, with the device ID and address and the part.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf52832-ficr
      - items:
          - enum:
              - nordic,nrf52833-ficr
              - nordic,nrf52840-ficr
          - const: nordic,nrf52832-ficr

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    ficr@10000000 {
        compatible = "nordic,nrf52840-ficr", "nordic,nrf52832-ficr";
        reg = <0x10000000 0x1000>;
    };
