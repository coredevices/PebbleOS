%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf54l15-ficr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L factory information configuration registers

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Read-only registers the factory programs, with the device ID, the trim
  values of the analog blocks and the crystal oscillator trims. Its cells
  are read as NVMEM cells, a word at a time.

allOf:
  - $ref: /schemas/nvmem/nvmem.yaml#
  - $ref: /schemas/nvmem/nvmem-deprecated-cells.yaml#

properties:
  compatible:
    const: nordic,nrf54l15-ficr

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    node@ffc000 {
        compatible = "nordic,nrf54l15-ficr";
        reg = <0xffc000 0x1000>;
        #address-cells = <1>;
        #size-cells = <1>;

        xosc32mtrim@620 {
            reg = <0x620 0x4>;
        };
    };
