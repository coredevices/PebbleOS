%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/nordic/nordic,nrf54l15-oscillators.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L oscillators and regulators

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Configures the crystal oscillators, their load capacitors and the PLL of
  the CPU clock, and shares its registers with the regulators. VREGMAIN, the
  main supply, runs from its LDO or, with an inductor fitted, from its DC/DC
  converter.

properties:
  compatible:
    const: nordic,nrf54l15-oscillators

  reg:
    maxItems: 1

  vregmain:
    type: object
    $ref: /schemas/regulator/regulator.yaml#
    unevaluatedProperties: false
    description:
      VREGMAIN, always on. regulator-initial-mode is
      NRF54L15_REGULATOR_MODE_LDO or NRF54L15_REGULATOR_MODE_DCDC, from
      dt-bindings/regulator/nordic,nrf54l15-regulators.h; the DC/DC
      converter needs the inductor on DCC.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    node@50120000 {
        compatible = "nordic,nrf54l15-oscillators";
        reg = <0x50120000 0x1000>;

        vregmain {
            regulator-name = "VREGMAIN";
            regulator-always-on;
            regulator-initial-mode = <1>;
        };
    };
