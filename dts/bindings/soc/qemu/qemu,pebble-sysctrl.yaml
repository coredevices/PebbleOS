%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/qemu/qemu,pebble-sysctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QEMU Pebble system controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  System control registers of the QEMU Pebble machines, with the reset reason and the Bluetooth
  address the host gives.

properties:
  compatible:
    items:
      - const: qemu,pebble-sysctrl
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@40007000 {
        compatible = "qemu,pebble-sysctrl", "syscon";
        reg = <0x40007000 0x1000>;
    };
