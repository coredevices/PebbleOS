%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/nordic,nrf52832-temp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF52 die temperature sensor

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Die temperature sensor, in steps of 0.25 Celsius.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf52832-temp
      - items:
          - enum:
              - nordic,nrf52833-temp
              - nordic,nrf52840-temp
          - const: nordic,nrf52832-temp

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    thermal-sensor@4000c000 {
        compatible = "nordic,nrf52840-temp", "nordic,nrf52832-temp";
        reg = <0x4000c000 0x1000>;
        interrupts = <12>;
    };
