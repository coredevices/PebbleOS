%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/sifli,sf32lb52-tsen.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 die temperature sensor

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

allOf:
  - $ref: thermal-sensor.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-tsen

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  sifli,hpsys-cfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS configuration block, holding the analog bandgap enable.

  '#thermal-sensor-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - sifli,hpsys-cfg

unevaluatedProperties: false

examples:
  - |
    thermal-sensor@50089000 {
        compatible = "sifli,sf32lb52-tsen";
        reg = <0x50089000 0x1000>;
        clocks = <&hpsys_rcc 36>;
        sifli,hpsys-cfg = <&hpsys_cfg>;
        #thermal-sensor-cells = <0>;
    };
