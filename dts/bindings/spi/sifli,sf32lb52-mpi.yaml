%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/sifli,sf32lb52-mpi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 MPI memory controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Controller for a SPI flash or PSRAM, up to quad or octal, with a window
  that maps the memory for reads and execution.

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

properties:
  compatible:
    enum:
      - sifli,sf32lb52-mpi
      - sifli,sf32lb57-mpi

  reg:
    items:
      - description: registers
      - description: memory-mapped window

  reg-names:
    items:
      - const: mpi
      - const: mpi_mm

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    spi@50042000 {
        compatible = "sifli,sf32lb52-mpi";
        reg = <0x50042000 0x1000>, <0x12000000 0xe000000>;
        reg-names = "mpi", "mpi_mm";
        interrupts = <86>;
        clocks = <&hpsys_rcc 27>;
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "jedec,spi-nor";
            reg = <0>;
            spi-rx-bus-width = <4>;
            spi-tx-bus-width = <4>;
        };
    };
