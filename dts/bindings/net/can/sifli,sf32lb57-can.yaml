%YAML 1.2
---
$id: http://devicetree.org/schemas/net/can/sifli,sf32lb57-can.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB57 CAN controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  CAN controller of the SF32LB57, a Fraunhofer IPMS CAN-CTRL core with its
  registers packed in 32-bit words. Its time quanta are counted in the
  controller clock.

allOf:
  - $ref: can-controller.yaml#

properties:
  compatible:
    const: sifli,sf32lb57-can

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  pinctrl-0: true

  pinctrl-names:
    const: default

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false

examples:
  - |
    can@5000a000 {
        compatible = "sifli,sf32lb57-can";
        reg = <0x5000a000 0x1000>;
        interrupts = <83>;
        clocks = <&hpsys_rcc 39>;
        resets = <&hpsys_rcc 39>;
    };
