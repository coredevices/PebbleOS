%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/sifli,sf32lb52-crc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 CRC unit

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

properties:
  compatible:
    const: sifli,sf32lb52-crc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    crc@50048000 {
        compatible = "sifli,sf32lb52-crc";
        reg = <0x50048000 0x1000>;
        clocks = <&hpsys_rcc 11>;
    };
