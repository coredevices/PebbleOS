%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/nordic,nrf52832-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF52 timer/counter

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Timer on HFCLK, or counter of its COUNT task, with capture/compare
  registers. TIMER3 and TIMER4 have six of them, the others four.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf52832-timer
      - items:
          - enum:
              - nordic,nrf52833-timer
              - nordic,nrf52840-timer
          - const: nordic,nrf52832-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    timer@4000a000 {
        compatible = "nordic,nrf52840-timer", "nordic,nrf52832-timer";
        reg = <0x4000a000 0x1000>;
        interrupts = <10>;
    };
