%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/nordic,nrf54l15-grtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L global real-time counter

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Counter of microseconds since it started, 52 bits wide, kept from the low-frequency clock in sleep, with compare channels. Each core has an interrupt and a counter of its own, and takes a compare channel no other core does.

properties:
  compatible:
    oneOf:
      - const: nordic,nrf54l15-grtc
      - items:
          - const: nordic,nrf54lm20a-grtc
          - const: nordic,nrf54l15-grtc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description:
      Low-frequency clock, which the core starts the counter from. A core
      without it leaves the counter to another one.

  nordic,compare-channel:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 11
    description: Compare channel of the core.

required:
  - compatible
  - reg
  - interrupts
  - nordic,compare-channel

additionalProperties: false

examples:
  - |
    node@500e2000 {
        compatible = "nordic,nrf54l15-grtc";
        reg = <0x500e2000 0x1000>;
        interrupts = <228>;
        clocks = <&clock 1>;
        nordic,compare-channel = <0>;
    };
