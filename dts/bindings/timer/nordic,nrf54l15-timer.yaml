%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/nordic,nrf54l15-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L timer/counter

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Timer on the clock of its power domain, or counter of its COUNT task, with capture/compare registers.

properties:
  compatible:
    const: nordic,nrf54l15-timer

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    node@500ca000 {
        compatible = "nordic,nrf54l15-timer";
        reg = <0x500ca000 0x1000>;
        interrupts = <202>;
    };
