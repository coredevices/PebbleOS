%YAML 1.2
---
$id: http://devicetree.org/schemas/iio/pressure/bosch,bmp390.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Bosch BMP390 barometric pressure sensor

maintainers:
  - Eric Migicovsky <eric@repebble.com>

properties:
  compatible:
    const: bosch,bmp390

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pressure@76 {
            compatible = "bosch,bmp390";
            reg = <0x76>;
        };
    };
