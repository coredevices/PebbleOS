%YAML 1.2
---
$id: http://devicetree.org/schemas/sram/sifli,sf32lb52-psram.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 in-package PSRAM

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  PSRAM stacked in the SF32LB52 package, on an MPI controller that maps it
  in its memory window. The die, and so its protocol (OPI, legacy or
  HyperBus), varies between lots of the same part: it is read at runtime
  from the factory-set PID field of the HPSYS_CFG IDR register.

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-psram

  reg:
    maxItems: 1

  size:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Size in bytes.

required:
  - compatible
  - reg
  - size

unevaluatedProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        psram@0 {
            compatible = "sifli,sf32lb52-psram";
            reg = <0>;
            size = <0x1000000>;
            spi-rx-bus-width = <8>;
            spi-tx-bus-width = <8>;
        };
    };
