%YAML 1.2
---
$id: http://devicetree.org/schemas/sram/qemu,pebble-psram.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QEMU Pebble PSRAM

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  External RAM of the QEMU Pebble machines that stand for a watch with PSRAM.
  It is always mapped and powered.

properties:
  compatible:
    const: qemu,pebble-psram

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    psram@60000000 {
        compatible = "qemu,pebble-psram";
        reg = <0x60000000 0x1000000>;
    };
