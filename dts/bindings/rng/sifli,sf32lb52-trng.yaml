%YAML 1.2
---
$id: http://devicetree.org/schemas/rng/sifli,sf32lb52-trng.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 true random number generator

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

properties:
  compatible:
    const: sifli,sf32lb52-trng

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

additionalProperties: false

examples:
  - |
    rng@5000f000 {
        compatible = "sifli,sf32lb52-trng";
        reg = <0x5000f000 0x1000>;
        clocks = <&hpsys_rcc 12>;
    };
