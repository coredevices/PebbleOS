%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/jedec,spi-nor.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SPI NOR flash

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  JEDEC NOR flash on a SPI memory controller, found by its JEDEC ID and
  described by its SFDP tables. The firmware drives one part, which the
  board names with a specific compatible before the generic one. This
  takes the place of the upstream binding of the same name, which only
  lists the specific compatibles of other parts.

allOf:
  - $ref: mtd.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - gigadevice,gd25lq255e
              - gigadevice,gd25q256e
              - puya,py25q128ha
          - const: jedec,spi-nor
      - const: jedec,spi-nor

  reg:
    minItems: 1
    maxItems: 2

  vcc-supply:
    description: Supply of the flash.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "gigadevice,gd25q256e", "jedec,spi-nor";
            reg = <0>;
            spi-rx-bus-width = <4>;
            spi-tx-bus-width = <4>;
        };
    };
