%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/qemu,pebble-flash.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QEMU Pebble internal flash

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Read-only flash of the QEMU Pebble machines, which the CPU reads and
  executes from. It is loaded with the firmware image and cannot be written.

allOf:
  - $ref: /schemas/mtd/mtd.yaml#

properties:
  compatible:
    const: qemu,pebble-flash

  reg:
    maxItems: 1

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    flash@0 {
        compatible = "qemu,pebble-flash";
        reg = <0x0 0x400000>;
    };
