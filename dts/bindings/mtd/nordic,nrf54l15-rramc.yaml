%YAML 1.2
---
$id: http://devicetree.org/schemas/mtd/nordic,nrf54l15-rramc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54L RRAM controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Controller that writes the internal RRAM, which the CPU reads
  and executes from at its own address. The RRAM is a child node.

properties:
  compatible:
    const: nordic,nrf54l15-rramc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

patternProperties:
  "^flash@[0-9a-f]+$":
    type: object
    $ref: /schemas/mtd/mtd.yaml#
    description: The internal RRAM, at its CPU address.

    properties:
      reg:
        maxItems: 1

    required:
      - reg

    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    flash-controller@5004b000 {
        compatible = "nordic,nrf54l15-rramc";
        reg = <0x5004b000 0x1000>;
        interrupts = <75>;
        #address-cells = <1>;
        #size-cells = <1>;

        flash@0 {
            reg = <0x0 0x17d000>;
        };
    };
