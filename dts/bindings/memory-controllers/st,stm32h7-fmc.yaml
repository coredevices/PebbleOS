%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/st,stm32h7-fmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32H7 flexible memory controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  The FMC drives SDRAM on its two SDRAM banks, each a chip select with its
  clock enable. The SDRAM banks appear at 0xc0000000 and 0xd0000000, or at
  0x60000000 and 0x70000000 with the banks swapped, where the CPU caches
  them and executes from them by default. Each SDRAM is a child node at its
  CPU address, which gives its bank and the mapping.

properties:
  compatible:
    const: st,stm32h7-fmc

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  "#address-cells":
    const: 1

  "#size-cells":
    const: 1

  ranges: true

patternProperties:
  "^sdram@[0-9a-f]+$":
    $ref: ddr/jedec,sdr-sdram.yaml#
    description: An SDRAM.

required:
  - compatible
  - reg
  - clocks
  - "#address-cells"
  - "#size-cells"
  - ranges

allOf:
  - $ref: /schemas/pinctrl/pinctrl-consumer.yaml#

unevaluatedProperties: false

examples:
  - |
    memory-controller@52004000 {
        compatible = "st,stm32h7-fmc";
        reg = <0x52004000 0x1000>;
        clocks = <&rcc 122>;
        #address-cells = <1>;
        #size-cells = <1>;
        ranges;

        sdram@70000000 {
            compatible = "issi,is42s32800g", "jedec,sdr-sdram";
            reg = <0x70000000 0x2000000>;
            io-width = <32>;
            banks = <4>;
            row-bits = <12>;
            col-bits = <9>;
            tRC = <60000>;
            tRAS-min = <42000>;
            tRP = <18000>;
            tRCD = <18000>;
            tWR = <12000>;
            tMRD = <12000>;
            tXSR = <70000>;
            tREF-ms = <64>;
            cas-latency-freqs = <2 100000000>, <3 166000000>;
        };
    };
