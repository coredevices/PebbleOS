%YAML 1.2
---
$id: http://devicetree.org/schemas/memory-controllers/cypress,hyperram.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HyperRAM

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  PSRAM with a HyperBus interface, on a controller that maps it in its memory
  window. Its size and manufacturer are read from its identification
  registers.

properties:
  compatible:
    const: cypress,hyperram

  reg:
    maxItems: 1

  vcc-supply:
    description: Supply of the memory.

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        psram@0 {
            compatible = "cypress,hyperram";
            reg = <0>;
            vcc-supply = <&buck1>;
        };
    };
