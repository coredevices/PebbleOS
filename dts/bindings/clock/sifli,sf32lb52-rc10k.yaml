%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sifli,sf32lb52-rc10k.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 RC10K oscillator

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Low-power RC oscillator of about 10 kHz, which runs in deep sleep. Its rate
  is measured against the 48 MHz crystal.

properties:
  compatible:
    const: sifli,sf32lb52-rc10k

  "#clock-cells":
    const: 0

required:
  - compatible
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    clock-rc10k {
        compatible = "sifli,sf32lb52-rc10k";
        #clock-cells = <0>;
    };
