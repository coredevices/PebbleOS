%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/sifli,sf32lb52-hxt48.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 48 MHz crystal oscillator

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  The 48 MHz crystal oscillator of the SF32LB52, whose load capacitance is
  trimmed from the factory configuration of the SoC, kept in nvmem cells.

properties:
  compatible:
    const: sifli,sf32lb52-hxt48

  "#clock-cells":
    const: 0

  clock-frequency:
    const: 48000000

  nvmem-cells:
    description: Cells holding the factory configuration, in search order.
    minItems: 1
    maxItems: 2

  nvmem-cell-names:
    minItems: 1
    items:
      - const: soc-config-user
      - const: soc-config-cust

required:
  - compatible
  - "#clock-cells"
  - clock-frequency

additionalProperties: false

examples:
  - |
    clock-hxt48 {
        compatible = "sifli,sf32lb52-hxt48";
        #clock-cells = <0>;
        clock-frequency = <48000000>;
        nvmem-cells = <&soc_config_user>, <&soc_config_cust>;
        nvmem-cell-names = "soc-config-user", "soc-config-cust";
    };
