%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/sifli,sf32lb52-usart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 USART

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

allOf:
  - $ref: /schemas/serial/serial.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-usart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  current-speed:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Initial baud rate, in bits per second.

  clocks:
    description: Absent on USART1, which the RCC cannot gate.
    maxItems: 1

  resets:
    maxItems: 1

  dmas:
    minItems: 1
    maxItems: 2

  dma-names:
    minItems: 1
    items:
      - enum: [rx, tx]
      - const: tx

required:
  - compatible
  - reg
  - interrupts
  - resets

unevaluatedProperties: false

examples:
  - |
    serial@50084000 {
        compatible = "sifli,sf32lb52-usart";
        reg = <0x50084000 0x1000>;
        interrupts = <59>;
        resets = <&hpsys_rcc 3>;
        current-speed = <1000000>;
        dmas = <&dmac1 0 5 1>;
        dma-names = "rx";
    };
