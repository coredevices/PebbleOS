%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/backlight/awinic,aw9364e.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW9364E one-wire backlight

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  White LED backlight driver controlled by a single GPIO line, as the Kinetic
  KTD253; enabling it gives full brightness, and pulses on the line dim it in
  16 steps.

allOf:
  - $ref: common.yaml#

properties:
  compatible:
    const: awinic,aw9364e

  enable-gpios:
    description: GPIO to use to enable/disable and dim the backlight.
    maxItems: 1

  default-brightness: true
  max-brightness: true

required:
  - compatible
  - enable-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    backlight {
        compatible = "awinic,aw9364e";
        enable-gpios = <&gpio1 1 GPIO_ACTIVE_HIGH>;
    };
