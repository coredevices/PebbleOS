%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/awinic,aw2016.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW2016 3-channel LED driver

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  RGB LED driver over I2C, as the AW2013. Its three channels drive an RGB LED,
  described as a multicolor LED.

properties:
  compatible:
    const: awinic,aw2016

  reg:
    maxItems: 1

  vcc-supply:
    description: Regulator providing power to the "VCC" pin.

  multi-led:
    type: object
    $ref: leds-class-multicolor.yaml#
    unevaluatedProperties: false

    properties:
      "#address-cells":
        const: 1

      "#size-cells":
        const: 0

    patternProperties:
      "^led@[0-2]$":
        type: object
        $ref: common.yaml#
        unevaluatedProperties: false

        properties:
          reg:
            description: Channel of the LED.
            maximum: 2

        required:
          - reg
          - color

    required:
      - "#address-cells"
      - "#size-cells"

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        led-controller@64 {
            compatible = "awinic,aw2016";
            reg = <0x64>;

            multi-led {
                color = <LED_COLOR_ID_RGB>;
                function = LED_FUNCTION_BACKLIGHT;
                #address-cells = <1>;
                #size-cells = <0>;

                led@0 {
                    reg = <0>;
                    color = <LED_COLOR_ID_RED>;
                };

                led@1 {
                    reg = <1>;
                    color = <LED_COLOR_ID_GREEN>;
                };

                led@2 {
                    reg = <2>;
                    color = <LED_COLOR_ID_BLUE>;
                };
            };
        };
    };
