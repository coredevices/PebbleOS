%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/st,stm32h7-bdma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32H7 basic DMA controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Eight-channel DMA controller of the D3 domain of the STM32H7, behind the
  DMAMUX2 request router, which consumers name in their DMA specifiers. It only
  reaches the memories of the D3 domain, as the SRAM4. Its specifiers take
  four cells, as those of st,stm32-dma; of the channel configuration, only the
  priority level, bits 16 and 17, applies.

allOf:
  - $ref: /schemas/dma/dma-controller.yaml#

properties:
  compatible:
    const: st,stm32h7-bdma

  reg:
    maxItems: 1

  interrupts:
    description: One per channel, from channel 0.
    minItems: 8
    maxItems: 8

  clocks:
    maxItems: 1

  "#dma-cells":
    const: 4

  dma-requests:
    const: 8

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - "#dma-cells"

unevaluatedProperties: false

examples:
  - |
    bdma: dma-controller@58025400 {
      compatible = "st,stm32h7-bdma";
      reg = <0x58025400 0x400>;
      interrupts = <129>, <130>, <131>, <132>, <133>, <134>, <135>, <136>;
      clocks = <&rcc 74>;
      #dma-cells = <4>;
      dma-requests = <8>;
    };

...
