%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/armchina,star-mc1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Arm China STAR-MC1 CPU

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Armv8-M Mainline core with the DSP extension, compatible with the
  Cortex-M33.

allOf:
  - $ref: /schemas/cpu.yaml#

properties:
  compatible:
    const: armchina,star-mc1

  reg:
    maxItems: 1

  cpu-idle-states:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    description:
      Idle states of the CPU, beyond the wait for interrupt, see
      /schemas/cpu/idle-states.yaml.

required:
  - compatible
  - device_type
  - reg

unevaluatedProperties: false

examples:
  - |
    cpus {
        #address-cells = <1>;
        #size-cells = <0>;

        cpu@0 {
            compatible = "armchina,star-mc1";
            device_type = "cpu";
            reg = <0>;
            cpu-idle-states = <&cpu_sleep>;
        };

        idle-states {
            cpu_sleep: cpu-sleep-0 {
                compatible = "arm,idle-state";
                entry-latency-us = <200>;
                exit-latency-us = <500>;
                min-residency-us = <10000>;
            };
        };
    };
