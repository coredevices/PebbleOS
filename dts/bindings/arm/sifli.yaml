%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/sifli.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SoC based boards

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

properties:
  $nodename:
    const: "/"
  compatible:
    oneOf:
      - description: Core Devices Pebble Time 2 (obelix)
        items:
          - enum:
              - coredevices,obelix-bb2
              - coredevices,obelix-dvt
              - coredevices,obelix-pvt
          - const: coredevices,obelix
          - const: sifli,sf32lb52

additionalProperties: true
