%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/sifli,sf32lb57-usb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB57 USB controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Mentor Graphics MUSB full-speed controller with its PHY, which the HPSYS
  configuration enables, on PA35 (D+) and PA36 (D-).

properties:
  compatible:
    const: sifli,sf32lb57-usb

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  sifli,hpsys-cfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS configuration, which enables the PHY and the bandgap it runs from.

  dr_mode:
    enum: [peripheral]

  pinctrl-0: true

  pinctrl-names: true

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - sifli,hpsys-cfg

additionalProperties: false

examples:
  - |
    usb@50047000 {
        compatible = "sifli,sf32lb57-usb";
        reg = <0x50047000 0x1000>;
        interrupts = <92>;
        clocks = <&hpsys_rcc 33>;
        sifli,hpsys-cfg = <&hpsys_cfg>;
    };
