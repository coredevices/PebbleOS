%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/nordic,nrf54lm20a-usbhs-phy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic nRF54LM20A USBHS PHY

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Wrapper of the USBHS controller and its UTMI+ high-speed PHY, on the
  dedicated D+ and D- pins, which powers them, resets them and overrides
  the PHY inputs. The PHY runs from XO24M, and from VREGUSB, which VBUS
  powers and which reports VBUS coming and going.

properties:
  compatible:
    const: nordic,nrf54lm20a-usbhs-phy

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  '#phy-cells':
    const: 0

  nordic,vregusb:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: VREGUSB, which senses VBUS.

required:
  - compatible
  - reg
  - clocks
  - '#phy-cells'
  - nordic,vregusb

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/nordic,nrf54l15-clock.h>
    phy@5005a000 {
        compatible = "nordic,nrf54lm20a-usbhs-phy";
        reg = <0x5005a000 0x1000>;
        clocks = <&clock NRF54L_CLOCK_XO24M>;
        #phy-cells = <0>;
        nordic,vregusb = <&vregusb>;
    };
