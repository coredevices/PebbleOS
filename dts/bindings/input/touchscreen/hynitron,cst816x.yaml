%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/hynitron,cst816x.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hynitron CST816x Series Capacitive Touch controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Self-capacitance touch controllers with single point gestures, as in Linux,
  with the common touchscreen properties added, for the resolution it reports.

allOf:
  - $ref: /schemas/input/touchscreen/touchscreen.yaml#

properties:
  compatible:
    enum:
      - hynitron,cst816s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  linux,keycodes:
    minItems: 1
    items:
      - description: Slide up gesture
      - description: Slide down gesture
      - description: Slide left gesture
      - description: Slide right gesture
      - description: Long press gesture

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        touchscreen@15 {
            compatible = "hynitron,cst816s";
            reg = <0x15>;
            interrupt-parent = <&gpio0>;
            interrupts = <4 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&gpio 17 GPIO_ACTIVE_LOW>;
            touchscreen-size-x = <200>;
            touchscreen-size-y = <228>;
        };
    };
