%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/qemu,pebble-touch.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QEMU Pebble touchscreen

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Touchscreen of the QEMU Pebble machines, driven by the host pointer over the
  display. It interrupts when the touch state or position changes.

allOf:
  - $ref: /schemas/input/touchscreen/touchscreen.yaml#

properties:
  compatible:
    const: qemu,pebble-touch

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    touchscreen@40011000 {
        compatible = "qemu,pebble-touch";
        reg = <0x40011000 0x1000>;
        interrupts = <9>;
        touchscreen-size-x = <200>;
        touchscreen-size-y = <228>;
    };
