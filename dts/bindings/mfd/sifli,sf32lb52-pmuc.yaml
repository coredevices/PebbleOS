%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/sifli,sf32lb52-pmuc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 power management unit controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  The always-on power management unit of the SF32LB52. It runs the
  oscillators of the SoC and provides their clocks, whose specifiers take one
  cell, an ID from <dt-bindings/clock/sifli,sf32lb52-pmuc.h>:

  - LRC10, the RC oscillator of about 10 kHz that runs in deep sleep;
  - LRC32, the RC oscillator of about 32 kHz;
  - LXT32, the oscillator of the 32.768 kHz crystal, on boards that fit one;
  - HRC48, the 48 MHz RC oscillator, which the unit trims against HXT48 with
    the calibration counter of the HPSYS RCC;
  - HXT48, the oscillator of the 48 MHz crystal, and HXT48_DLL, the same
    through the buffer that feeds the DLLs;
  - WDT, clk_wdt, LRC10 or LRC32, which clocks the watchdogs and the unit
    itself.

  It also powers the HPSYS, a power domain whose specifiers take one cell, an
  ID from <dt-bindings/power/sifli,sf32lb52-pmuc.h>. Its performance states
  are the voltage modes of the HPSYS, D0, D1, S0 and S1, the opp-level values
  of its OPP table, from the same header: each sets the buck and HPSYS LDO
  voltages, trimmed at the factory, and the voltage mode and memory timings of
  the HPSYS configuration.

  The load capacitance of the 48 MHz crystal is trimmed from the factory
  configuration of the SoC, kept in nvmem cells.

properties:
  compatible:
    const: sifli,sf32lb52-pmuc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#clock-cells":
    const: 1

  "#power-domain-cells":
    const: 1

  operating-points-v2:
    maxItems: 1

  sifli,hpsys-cfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS configuration, for the voltage mode and memory timings.

  sifli,hpsys-rcc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS RCC, for its HRC48 calibration counter.

  sifli,bt-mac:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Bluetooth controller, for its LRC10 calibration counter.

  sifli,lpsys-aon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: LPSYS always-on block, requesting the crystal LRC10 is counted against.

  sifli,lpsys-rcc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: LPSYS RCC, running LPSYS from the crystal while LRC10 is counted.

  hwlocks:
    description: Lock of the LRC10 calibration counter, shared with the LCPU.
    maxItems: 1

  clocks:
    minItems: 1
    items:
      - description: 48 MHz crystal
      - description: 32.768 kHz crystal

  clock-names:
    minItems: 1
    items:
      - const: hxt48
      - const: lxt32

  nvmem-cells:
    description: Cells holding the factory configuration, in search order.
    minItems: 1
    maxItems: 2

  nvmem-cell-names:
    minItems: 1
    items:
      - const: soc-config-user
      - const: soc-config-cust

required:
  - compatible
  - reg
  - "#clock-cells"
  - "#power-domain-cells"
  - operating-points-v2
  - sifli,hpsys-cfg
  - sifli,hpsys-rcc
  - sifli,bt-mac
  - sifli,lpsys-aon
  - sifli,lpsys-rcc
  - hwlocks
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    power-management@500ca000 {
        compatible = "sifli,sf32lb52-pmuc";
        reg = <0x500ca000 0x1000>;
        interrupts = <48>;
        #clock-cells = <1>;
        #power-domain-cells = <1>;
        clocks = <&xtal48m>;
        clock-names = "hxt48";
        operating-points-v2 = <&hpsys_opp_table>;
        sifli,hpsys-cfg = <&hpsys_cfg>;
        sifli,hpsys-rcc = <&hpsys_rcc>;
        sifli,bt-mac = <&bt_mac>;
        sifli,lpsys-aon = <&lpsys_aon>;
        sifli,lpsys-rcc = <&lpsys_rcc>;
        hwlocks = <&mailbox2 0>;
        nvmem-cells = <&soc_config_user>, <&soc_config_cust>;
        nvmem-cell-names = "soc-config-user", "soc-config-cust";
    };
