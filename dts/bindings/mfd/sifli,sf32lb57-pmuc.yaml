%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/sifli,sf32lb57-pmuc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB57 power management unit controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  The always-on power management unit of the SF32LB57. It runs the
  oscillators of the SoC and provides their clocks, whose specifiers take one
  cell, an ID from <dt-bindings/clock/sifli,sf32lb57-pmuc.h>:

  - LRC10, the RC oscillator of about 10 kHz that runs in deep sleep;
  - LRC32, the RC oscillator of about 32 kHz;
  - LXT32, the oscillator of the 32.768 kHz crystal, on boards that fit one;
  - HRC48, the 48 MHz RC oscillator;
  - HXT48, the oscillator of the 48 MHz crystal, and HXT48_DLL, the same
    through the buffer that feeds the DLLs;
  - WDT, clk_wdt, LRC10 or LRC32, which clocks the watchdogs and the unit
    itself;
  - RTC, clk_rtc, LRC10 or LXT32, which the RTC and the low-power timers
    count.

properties:
  compatible:
    const: sifli,sf32lb57-pmuc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#clock-cells":
    const: 1

  clocks:
    minItems: 1
    items:
      - description: 48 MHz crystal
      - description: 32.768 kHz crystal

  clock-names:
    minItems: 1
    items:
      - const: hxt48
      - const: lxt32

required:
  - compatible
  - reg
  - "#clock-cells"
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    power-management@500ca000 {
        compatible = "sifli,sf32lb57-pmuc";
        reg = <0x500ca000 0x1000>;
        interrupts = <48>;
        #clock-cells = <1>;
        clocks = <&xtal48m>;
        clock-names = "hxt48";
    };
