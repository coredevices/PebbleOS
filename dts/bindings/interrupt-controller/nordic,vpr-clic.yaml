%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/nordic,vpr-clic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nordic VPR core-local interrupt controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  The CLIC of a VPR RISC-V core, which only that core sees. Each line has a
  pending, an enable, an attribute and a control byte, the control byte
  holding its level, of which the most urgent is the highest.

properties:
  compatible:
    const: nordic,vpr-clic

  reg:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

  "#address-cells":
    const: 0

required:
  - compatible
  - reg
  - interrupt-controller
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    interrupt-controller@f0000000 {
        compatible = "nordic,vpr-clic";
        reg = <0xf0000000 0x143c>;
        interrupt-controller;
        #interrupt-cells = <1>;
        #address-cells = <0>;
    };
