%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/sifli,sf32lb52-efuse.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 and SF32LB57 eFuse controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  The eFuse of the SF32LB52, 128 bytes in four banks, or of the SF32LB57, 96
  bytes in three, holding the unique ID and the factory calibration. SF32LB52
  reads need the HPSYS LDO raised, in the PMUC.

allOf:
  - $ref: nvmem.yaml#
  - if:
      properties:
        compatible:
          const: sifli,sf32lb52-efuse
    then:
      required:
        - sifli,pmuc

properties:
  compatible:
    enum:
      - sifli,sf32lb52-efuse
      - sifli,sf32lb57-efuse

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  sifli,pmuc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMUC, holding the HPSYS LDO that SF32LB52 reads raise.

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    efuse@5000c000 {
        compatible = "sifli,sf32lb52-efuse";
        reg = <0x5000c000 0x1000>;
        clocks = <&hpsys_rcc 9>;
        sifli,pmuc = <&pmuc>;
        read-only;
    };
