%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/sifli,sf32lb52-rtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 and SF32LB57 real-time clock

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Calendar RTC with an alarm, which wakes the system from hibernate. On the
  SF32LB52 it selects clk_rtc, LRC10 or LXT32, which it counts and provides
  to the low-power timers and the Bluetooth sleep timer; on the SF32LB57 the
  PMU provides clk_rtc.

allOf:
  - $ref: rtc.yaml#
  - if:
      properties:
        compatible:
          const: sifli,sf32lb57-rtc
    then:
      properties:
        "#clock-cells": false
        clocks:
          items:
            - description: clk_rtc, from the PMU
        clock-names:
          items:
            - const: rtc
    else:
      properties:
        clocks:
          items:
            - description: LRC10 oscillator
            - description: LXT32 oscillator
        clock-names:
          items:
            - const: lrc10
            - const: lxt32
      required:
        - "#clock-cells"

properties:
  compatible:
    enum:
      - sifli,sf32lb52-rtc
      - sifli,sf32lb57-rtc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  "#clock-cells":
    const: 0

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    maxItems: 2

  sifli,hpsys-cfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS configuration block, holding the shadow time and date.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - sifli,hpsys-cfg

unevaluatedProperties: false

examples:
  - |
    rtc@500cb000 {
        compatible = "sifli,sf32lb52-rtc";
        reg = <0x500cb000 0x1000>;
        interrupts = <49>;
        #clock-cells = <0>;
        clocks = <&pmuc 0>, <&pmuc 2>;
        clock-names = "lrc10", "lxt32";
        sifli,hpsys-cfg = <&hpsys_cfg>;
    };
