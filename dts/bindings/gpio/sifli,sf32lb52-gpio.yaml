%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/sifli,sf32lb52-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 GPIO controller (HPSYS GPIO1)

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  GPIO controller of the PA pads. Each pad is also an interrupt source.

properties:
  compatible:
    const: sifli,sf32lb52-gpio

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  gpio-controller: true

  gpio-ranges:
    maxItems: 1

  '#gpio-cells':
    const: 2

  ngpios:
    maximum: 45

  gpio-reserved-ranges: true

  sifli,hpsys-aon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS always-on block, where wakeup pins latch.

  interrupt-controller: true

  '#interrupt-cells':
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - gpio-controller
  - '#gpio-cells'
  - ngpios
  - sifli,hpsys-aon
  - interrupt-controller
  - '#interrupt-cells'

additionalProperties: false

examples:
  - |
    gpio@500a0000 {
        compatible = "sifli,sf32lb52-gpio";
        reg = <0x500a0000 0x1000>;
        interrupts = <84>;
        clocks = <&hpsys_rcc 25>;
        gpio-controller;
        #gpio-cells = <2>;
        ngpios = <45>;
        sifli,hpsys-aon = <&hpsys_aon>;
        interrupt-controller;
        #interrupt-cells = <2>;
    };
