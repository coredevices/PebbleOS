%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/sifli,sf32lb52-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 pin controller (HPSYS PINMUX)

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  Selects the function of each SA and PA pad and configures the pad. Functions
  are named after the signal, e.g. i2c1_scl. Pin configuration states are
  children of the controller, holding groups of pins that share a function and
  a pad configuration.

properties:
  compatible:
    const: sifli,sf32lb52-pinctrl

  reg:
    maxItems: 1

  sifli,hpsys-cfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS configuration block, holding the pin routing crossbar.

  sifli,rtc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: RTC, holding the always-on pad pulls and backup outputs.

  sifli,hpsys-aon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS always-on block, selecting the backup timer outputs.

patternProperties:
  '-state$':
    type: object
    description: A pin configuration state, referenced from pinctrl-N.

    patternProperties:
      '^(.+-)?pins$':
        type: object
        description: A group of pins sharing their pad configuration.
        allOf:
          - $ref: /schemas/pinctrl/pincfg-node.yaml#
          - $ref: /schemas/pinctrl/pinmux-node.yaml#

        properties:
          pins:
            items:
              pattern: '^(PA|SA)[0-9][0-9]$'

          function:
            pattern: '^[a-z0-9_]+$'

          bias-pull-up: true
          bias-pull-down: true
          input-enable: true

          output-low:
            description: Driven low by GPIO1, with the gpio function.
            type: boolean

          drive-strength:
            enum: [2, 4, 8, 12, 20]

        required:
          - pins
          - function

        additionalProperties: false

    additionalProperties: false

required:
  - compatible
  - reg
  - sifli,hpsys-cfg
  - sifli,rtc
  - sifli,hpsys-aon

additionalProperties: false

examples:
  - |
    pinctrl@50003000 {
        compatible = "sifli,sf32lb52-pinctrl";
        reg = <0x50003000 0x100>;
        sifli,hpsys-cfg = <&hpsys_cfg>;
        sifli,rtc = <&rtc>;
        sifli,hpsys-aon = <&hpsys_aon>;

        i2c1-default-state {
            scl-pins {
                pins = "PA31";
                function = "i2c1_scl";
                input-enable;
                drive-strength = <8>;
            };
        };
    };
