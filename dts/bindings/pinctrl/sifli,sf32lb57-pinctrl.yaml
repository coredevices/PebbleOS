%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/sifli,sf32lb57-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB57 pin controller (HPSYS PINMUX)

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description: |
  Selects the function of each SA, SB and PA pad and configures the pad. Any
  PA pad takes any signal of the FreeIO matrix. Functions are named after the
  signal, e.g. usart1_txd. Pin configuration states are children of the
  controller, holding groups of pins that share a function and a pad
  configuration.

properties:
  compatible:
    const: sifli,sf32lb57-pinctrl

  reg:
    maxItems: 1

patternProperties:
  '-state$':
    type: object
    description: A pin configuration state, referenced from pinctrl-N.

    patternProperties:
      '^(.+-)?pins$':
        type: object
        description: A group of pins sharing their pad configuration.
        allOf:
          - $ref: /schemas/pinctrl/pincfg-node.yaml#
          - $ref: /schemas/pinctrl/pinmux-node.yaml#

        properties:
          pins:
            items:
              pattern: '^(PA|SA|SB)[0-9][0-9]$'

          function:
            pattern: '^[a-z0-9_]+$'

          bias-pull-up: true
          bias-pull-down: true
          input-enable: true

          drive-strength:
            enum: [2, 4, 8, 12]

        required:
          - pins
          - function

        additionalProperties: false

    additionalProperties: false

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    pinctrl@50003000 {
        compatible = "sifli,sf32lb57-pinctrl";
        reg = <0x50003000 0x150>;

        usart1-default-state {
            tx-pins {
                pins = "PA19";
                function = "usart1_txd";
                drive-strength = <4>;
            };
        };
    };
