%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/qemu,pebble-wdog.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: QEMU Pebble watchdog

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  Watchdog timer of the QEMU Pebble machines, an ARM CMSDK APB watchdog on the 1 MHz reference
  clock.

properties:
  compatible:
    const: qemu,pebble-wdog

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    watchdog@40013000 {
        compatible = "qemu,pebble-wdog";
        reg = <0x40013000 0x1000>;
    };
