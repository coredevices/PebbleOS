%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/sifli,sf32lb52-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 watchdog

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  WDT1 of the SF32LB52 and SF32LB57, which resets the system through the
  PMUC. It counts clk_wdt of the PMUC.

allOf:
  - $ref: watchdog.yaml#
  - if:
      properties:
        compatible:
          const: sifli,sf32lb52-wdt
    then:
      required:
        - sifli,hpsys-cfg

properties:
  compatible:
    enum:
      - sifli,sf32lb52-wdt
      - sifli,sf32lb57-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  sifli,hpsys-cfg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: HPSYS configuration block, routing the watchdog to the reboot.

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    watchdog@50094000 {
        compatible = "sifli,sf32lb52-wdt";
        reg = <0x50094000 0x1000>;
        clocks = <&pmuc 5>;
        sifli,hpsys-cfg = <&hpsys_cfg>;
    };
