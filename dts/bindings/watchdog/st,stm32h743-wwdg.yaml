%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/st,stm32h743-wwdg.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: STMicroelectronics STM32H7 window watchdog

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

description:
  The window watchdog (WWDG) of an STM32H7, counting down its APB clock. On a
  dual-core STM32H7 each core has one, which resets that core alone unless the
  RCC widens its reset to the system.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: st,stm32h743-wwdg

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    watchdog@40002c00 {
        compatible = "st,stm32h743-wwdg";
        reg = <0x40002c00 0x400>;
        clocks = <&rcc 89>;
    };
