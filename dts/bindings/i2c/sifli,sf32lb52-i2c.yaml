%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/sifli,sf32lb52-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiFli SF32LB52 I2C controller

maintainers:
  - Gerard Marull-Paretas <gerard@teslabs.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: sifli,sf32lb52-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    enum: [100000, 400000, 1000000]

  dmas:
    maxItems: 1

  dma-names:
    const: rx

  pinctrl-0: true
  pinctrl-names: true

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    i2c@5009c000 {
        compatible = "sifli,sf32lb52-i2c";
        reg = <0x5009c000 0x1000>;
        interrupts = <61>;
        clocks = <&rcc 27>;
        clock-frequency = <400000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
