compatible: nordic,nrf54l15-vpr
config: REMOTEPROC_NRF_VPR
class: rproc
define: PBL_RPROC_NRF_VPR_DEFINE
args:
  - name: true
  - reg: 0
  - reg: 0
    of: nordic,spu
  - reg: 0
    of: nordic,firmware
  - size: 0
    of: nordic,firmware
  - reg: 0
    of: memory-region
    default: 0
  - size: 0
    of: memory-region
    default: 0
  - flag: nordic,auto-boot
