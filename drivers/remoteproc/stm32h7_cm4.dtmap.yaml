compatible: st,stm32h747-m4
config: REMOTEPROC_STM32H7_CM4
class: rproc
define: PBL_RPROC_STM32H7_CM4_DEFINE
args:
  - name: true
  - reg: 0
    of: st,syscfg-holdboot
  - prop: st,syscfg-holdboot
    index: 1
  - prop: st,syscfg-holdboot
    index: 2
  - reg: 0
    of: st,syscfg-boot-address
  - prop: st,syscfg-boot-address
    index: 1
  - prop: st,syscfg-boot-address
    index: 2
  - reg: 0
    of: st,syscfg-flash
  - prop: st,syscfg-flash
    index: 1
  - prop: st,syscfg-flash
    index: 2
  - flag: st,auto-boot
