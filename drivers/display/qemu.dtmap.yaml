compatible: qemu,pebble-display
config: DISPLAY_QEMU
class: display
define: PBL_DISPLAY_QEMU_DEFINE
args:
  - name: true
  - reg: regs
  - reg: fb
  - prop: width
  - prop: height
  - prop: bits-per-pixel
  - flag: qemu,round-mask
