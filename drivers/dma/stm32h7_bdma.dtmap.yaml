compatible: st,stm32h7-dmamux
masters: st,stm32h7-bdma
config: DMA_STM32H7_BDMA
class: dma
define: PBL_DMA_STM32H7_BDMA_DEFINE
# The request line is the channel
provides:
  dma: "PBL_DMA_CHAN(&{sym}, {0}, {0}, {1})"
args:
  - name: true
  - reg: 0
  - reg: 0
    of: dma-masters
  - clock: 0
    of: dma-masters
  - irq: 0
    of: dma-masters
  - irq: 1
    of: dma-masters
  - irq: 2
    of: dma-masters
  - irq: 3
    of: dma-masters
  - irq: 4
    of: dma-masters
  - irq: 5
    of: dma-masters
  - irq: 6
    of: dma-masters
  - irq: 7
    of: dma-masters
