compatible: ti,drv2604
config: VIBE_DRV2604
class: vibe
define: PBL_DRV2604_DEFINE
args:
  - parent: i2c
  - reg: 0
  - gpio: enable
  - prop: mode
    default: 0
  - prop: vib-rated-mv
    default: 1384
  - prop: vib-overdrive-mv
    default: 3009
  - flag: ti,lra-open-loop
