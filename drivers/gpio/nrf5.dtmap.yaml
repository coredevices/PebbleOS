compatible: nordic,nrf52832-gpio
config: GPIO_NRF5
class: [gpio, intc]
define: PBL_GPIO_NRF5_DEFINE
symbol:
  gpio: "{sym}"
  intc: "{sym}_intc"
args:
  - name: true
  - reg: 0
  - reg: 0
    of: nordic,gpiote
  - prop: ngpios
    default: 32
