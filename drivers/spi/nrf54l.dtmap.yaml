compatible: nordic,nrf54l15-spim
config: SPI_NRF54L
class: spi
define: PBL_SPI_NRF54L_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - prop: clock-frequency
  - prop: max-frequency
  - gpio: sck
  - gpio: mosi
    default: PBL_GPIO(nullptr, 0, 0)
  - gpio: miso
    default: PBL_GPIO(nullptr, 0, 0)
  - gpio: cs
    all: true
    optional: true
