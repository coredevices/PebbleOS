compatible: sifli,sf32lb57-spi
config: SPI_SF32LB57
class: spi
define: PBL_SPI_SF32LB57_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - clock: 0
  - pinctrl: default
  - dma: tx
    optional: true
  - gpio: cs
    all: true
    optional: true
