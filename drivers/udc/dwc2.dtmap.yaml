compatible:
  - st,stm32f7-hsotg
  - nordic,nrf54lm20a-usbhs
config: UDC_DWC2
class: udc
define: PBL_UDC_DWC2_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - compatible: true
    values:
      st,stm32f7-hsotg: DWC2_STM32
      nordic,nrf54lm20a-usbhs: DWC2_UTMI
  - clock: otg
    optional: true
  - phandle: phys
    as: phy
    optional: true
  - supply: usb33d
    optional: true
  - pinctrl: default
    optional: true
  - prop: g-rx-fifo-size
    default: 256
  - prop: g-np-tx-fifo-size
    default: 32
  - prop: g-tx-fifo-size
    item: "{0}"
