compatible: sifli,sf32lb57-sdmmc
config: SDHC_SF32LB_SDMMC
class: sdhc
define: PBL_SDHC_SF32LB_SDMMC_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - clock: 0
  - pinctrl: default
  - prop: bus-width
    default: "1"
  - prop: max-frequency
    default: "25000000"
  - gpio: cd
    default: "{}"
  - dma: rx-tx
    default: nullptr
