compatible: sifli,sf32lb52-mpi
config: MEMC_SF32LB52_MPI
class: sf32lb52_mpi
define: PBL_SF32LB52_MPI_DEFINE
args:
  - name: true
  - reg: mpi
  - reg: mpi_mm
  - size: mpi_mm
  - clock: 0
  - pinctrl: default
    default: nullptr
  - assigned-clocks: PBL_CLK_ASSIGNED
    optional: true
