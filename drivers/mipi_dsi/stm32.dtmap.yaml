compatible: st,stm32-dsi
config: MIPI_DSI_STM32
class: [mipi_dsi, display_bridge]
define: PBL_MIPI_DSI_STM32_DEFINE
symbol:
  mipi_dsi: "{sym}"
  display_bridge: "{sym}_bridge"
args:
  - name: true
  - reg: 0
  - irq: 0
  - clock: pclk
  - clock: ref
  - pinctrl: default
    optional: true
