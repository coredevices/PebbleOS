compatible: st,stm32h7-uart
config: UART_STM32
class: uart
define: PBL_UART_STM32_DEFINE
args:
  - name: true
  - reg: 0
  - irq: 0
  - clock: 0
  - prop: current-speed
    default: 115200
  - pinctrl: default
  - dma: rx
    optional: true
    variadic: true
