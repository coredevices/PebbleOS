<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PebbleOS</title>
<script>
  // Embedded in the documentation: ?embed, and the page's ?theme. Embedded
  // in another page as just the display: ?screen, which shows the screen alone
  // and takes no input; ?serial, which gives the parent page the QEMU serial
  // protocol and app installs over postMessage.
  const params = new URLSearchParams(location.search);
  const screenOnly = params.has('screen');
  const embedded = params.has('embed') || screenOnly;
  if (embedded) document.documentElement.dataset.embed = '';
  if (screenOnly) document.documentElement.dataset.screen = '';
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #15171a;
    --fg: #d6d8db;
    --dim: #868b92;
    --panel: #1f2226;
    --line: #2d3136;
    --accent: #ff4f1f;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --fg: #1f2328;
    --dim: #59636e;
    --panel: #f6f8fa;
    --line: #d1d9e0;
  }
  :root[data-embed], :root[data-embed] body { height: auto; background: transparent; }
  /* The frame clips: room for the watch's shadow on every side. */
  :root[data-embed] body { padding: 40px; }
  /* The frame grows with the page, so not in viewport units. */
  :root[data-embed] #log { height: 220px; }
  /* The screen alone fills the frame, with nothing around it to press. */
  :root[data-screen] body { padding: 0; }
  :root[data-screen] :is(.frame, .btn, #bar, #log) { display: none; }
  :root[data-screen] #watch, :root[data-screen] #canvas { pointer-events: none; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column; align-items: center; gap: 14px;
    padding: 20px 16px 16px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* The watch is laid out on the frame artwork's grid, --px per cell. */
  #watch {
    --px: 1.5px;
    position: relative; flex: none;
    width: calc(var(--fw) * var(--px)); height: calc(var(--fh) * var(--px));
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .frame { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* A copy under the screen casts the shadow, which would show through the screen hole. */
  #shadow { filter: drop-shadow(0 18px 36px rgba(0, 0, 0, .55)); }
  :root[data-theme="light"] #shadow { filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .28)); }
  #canvas, #screen, #boot {
    position: absolute;
    left: calc(var(--sx) * var(--px)); top: calc(var(--sy) * var(--px));
    width: calc(var(--sw) * var(--px)); height: calc(var(--sh) * var(--px));
  }
  #watch.round #screen, #watch.round #boot { border-radius: 50%; }
  /* SDL draws here; the screen below shows it, so the browser never scales it. */
  #canvas { opacity: 0; outline: none; display: block; }
  #screen { background: #000; display: block; }
  #boot {
    display: flex; align-items: center; justify-content: center; background: #000;
    color: #fff; font-weight: 600; letter-spacing: .02em; pointer-events: none;
    transition: opacity .3s;
  }
  #boot.done { opacity: 0; }
  #boot.crash {
    flex-direction: column; gap: 8px; padding: 12px; opacity: 1; pointer-events: auto;
    text-align: center; font-weight: 400; letter-spacing: 0;
  }
  #boot.crash strong { color: var(--accent); font-size: 15px; }
  #boot.crash small { color: var(--dim); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
                      overflow-wrap: anywhere; }

  .btn {
    position: absolute; padding: 0; border: 0; border-radius: 3px; cursor: pointer;
    background: rgba(255, 255, 255, 0); transition: background .08s;
  }
  .btn:hover { background: rgba(255, 255, 255, .14); }
  .btn.down { background: rgba(0, 0, 0, .35); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px;
         max-width: 720px; color: var(--dim); }
  #bar .group { display: flex; align-items: center; gap: 8px; }
  #bar .group[hidden] { display: none; }
  kbd { display: inline-block; min-width: 1.7em; padding: 1px 6px; border: 1px solid var(--line);
        border-bottom-width: 2px; border-radius: 5px; background: var(--panel); color: var(--fg);
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; }
  .swatch { width: 18px; height: 18px; padding: 0; border-radius: 50%; cursor: pointer;
            border: 2px solid var(--line); }
  .swatch[aria-pressed="true"] { border-color: var(--fg); }
  button.text { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
                background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; }
  button.text:hover { border-color: var(--dim); }
  #apps[hidden] { display: none; }
  #app-url { width: 240px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
             background: var(--panel); color: var(--fg); font: inherit; }
  body.drop #watch { outline: 2px dashed var(--accent); outline-offset: 8px; border-radius: 12px; }

  #log { width: min(720px, 100%); height: 28vh; margin: 0; padding: 8px 10px; overflow: auto;
         border: 1px solid var(--line); border-radius: 8px; background: #0c0d0f; color: #b9bdc2;
         font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  #log[hidden] { display: none; }
</style>
</head>
<body>
<div id="watch">
  <img class="frame" id="shadow" alt="">
  <canvas id="screen"></canvas>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="boot">Loading…</div>
  <img class="frame" id="frame" alt="">
  <button class="btn" id="b-back"   data-key="Escape"     aria-label="Back"></button>
  <button class="btn" id="b-up"     data-key="ArrowUp"    aria-label="Up"></button>
  <button class="btn" id="b-select" data-key="ArrowRight" aria-label="Select"></button>
  <button class="btn" id="b-down"   data-key="ArrowDown"  aria-label="Down"></button>
</div>

<div id="bar">
  <span class="group"><kbd>←</kbd>back <kbd>↑</kbd>up <kbd>→</kbd>select <kbd>↓</kbd>down</span>
  <span class="group" id="touch-hint">Mouse is a finger, wheel drags</span>
  <span class="group" id="swatches"></span>
  <span class="group">
    <button class="text" id="reset">Reset</button>
    <button class="text" id="toggle-log" aria-expanded="false">Show log</button>
  </span>
  <span class="group" id="apps" hidden>
    <input id="app-url" type="url" placeholder="URL of a .pbw" aria-label="URL of a .pbw">
    <button class="text" id="app-install">Install</button>
    <button class="text" id="app-open">Open .pbw…</button>
    <input id="app-file" type="file" accept=".pbw" hidden>
  </span>
</div>
<pre id="log" hidden></pre>

<script>
  const $ = (id) => document.getElementById(id);

  // Frame artwork and where the screen and buttons sit on it, as the QEMU
  // decorations; the first skin is the default.
  const PLATFORMS = {
    emery: {
      size: [293, 432], screen: [46, 102, 200, 228], touch: true,
      skins: {
        'pt2-br': ['Black and red', '#2c2d2f', '#ff4f1f'],
        'pt2-bg': ['Black and grey', '#2c2d2f', '#585653'],
        'pt2-sb': ['Silver and blue', '#cfd2d4', '#2a9be0'],
        'pt2-sg': ['Silver and grey', '#cfd2d4', '#848581'],
      },
      buttons: {
        'b-back': [0, 112, 16, 60], 'b-up': [277, 112, 16, 60],
        'b-select': [277, 184, 16, 60], 'b-down': [277, 260, 16, 60],
      },
    },
    gabbro: {
      size: [330, 460], screen: [36, 100, 260, 260], round: true, touch: true,
      skins: {
        'pr2-bk20': ['Black', '#2a2a2a', '#2a2a2a'],
        'pr2-sl20': ['Silver and white', '#c9cbcd', '#ebe8e2'],
        'pr2-sl14': ['Silver and brown leather', '#c9cbcd', '#7a4a2e'],
        'pr2-gd14': ['Gold', '#e08e43', '#0067af'],
      },
      buttons: {
        'b-back': [0, 212, 18, 36], 'b-up': [298, 148, 22, 32],
        'b-select': [308, 212, 22, 32], 'b-down': [290, 276, 26, 34],
      },
    },
    flint: {
      size: [220, 403], screen: [38, 117, 144, 168],
      skins: {
        'p2d-bk': ['Black', '#0d0d0d', '#313131'],
        'p2d-wh': ['White', '#eaeaea', '#eeeeee'],
      },
      buttons: {
        'b-back': [0, 116, 10, 48], 'b-up': [210, 116, 10, 48],
        'b-select': [210, 176, 10, 52], 'b-down': [210, 240, 10, 44],
      },
    },
  };
  const PLATFORM = PLATFORMS['@PBL_PLATFORM_NAME@'];
  if (screenOnly) {
    const [, , sw, sh] = PLATFORM.screen;
    PLATFORM.size = [sw, sh];
    PLATFORM.screen = [0, 0, sw, sh];
  }
  const [FW, FH] = PLATFORM.size;

  {
    const watch = $('watch');
    const [sx, sy, sw, sh] = PLATFORM.screen;
    for (const [k, v] of Object.entries({ fw: FW, fh: FH, sx, sy, sw, sh })) {
      watch.style.setProperty('--' + k, v);
    }
    watch.classList.toggle('round', !!PLATFORM.round);
    for (const [id, [x, y, w, h]] of Object.entries(PLATFORM.buttons)) {
      Object.assign($(id).style, {
        left: `${100 * x / FW}%`, top: `${100 * y / FH}%`,
        width: `${100 * w / FW}%`, height: `${100 * h / FH}%`,
      });
    }
    $('touch-hint').hidden = !PLATFORM.touch;
    for (const [skin, [label, a, b]] of Object.entries(PLATFORM.skins)) {
      const s = document.createElement('button');
      s.className = 'swatch';
      s.dataset.skin = skin;
      s.setAttribute('aria-label', label);
      s.style.background = `linear-gradient(135deg, ${a} 50%, ${b} 50%)`;
      $('swatches').append(s);
    }
  }

  const canvas = $('canvas');
  const log = $('log');
  // The screen alone takes no input: no focus, and the user's keys stop here.
  if (screenOnly) {
    canvas.removeAttribute('tabindex');
    for (const type of ['keydown', 'keyup', 'keypress']) {
      window.addEventListener(type, (e) => e.stopImmediatePropagation(), true);
    }
  }
  const screen = $('screen');
  const ctx = screen.getContext('2d');

  // Keep the frame around after it is shown, for the screen to copy.
  const getContext = canvas.getContext.bind(canvas);
  canvas.getContext = (type, attrs) =>
    getContext(type, type.startsWith('webgl') ? { ...attrs, preserveDrawingBuffer: true } : attrs);

  // Emscripten's SDL reads key events from the window.
  const KEYS = {
    Escape: { keyCode: 27, button: 'b-back' },
    ArrowLeft: { keyCode: 37, button: 'b-back' },
    Backspace: { keyCode: 8, button: 'b-back' },
    ArrowUp: { keyCode: 38, button: 'b-up' },
    ArrowRight: { keyCode: 39, button: 'b-select' },
    Enter: { keyCode: 13, button: 'b-select' },
    ' ': { keyCode: 32, button: 'b-select' },
    ArrowDown: { keyCode: 40, button: 'b-down' },
  };
  const CODES = { ' ': 'Space' };

  function sendKey(type, key) {
    const k = KEYS[key];
    window.dispatchEvent(new KeyboardEvent(type, {
      key, code: CODES[key] || key, keyCode: k.keyCode, which: k.keyCode, bubbles: true,
    }));
  }

  // Frame buttons: held while the pointer is down, so long presses work.
  for (const el of document.querySelectorAll('.btn')) {
    const key = el.dataset.key;
    let held = false;
    const release = () => {
      if (!held) return;
      held = false;
      el.classList.remove('down');
      sendKey('keyup', key);
    };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      held = true;
      el.classList.add('down');
      sendKey('keydown', key);
    });
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  // Keyboard presses light up the matching frame button.
  for (const type of ['keydown', 'keyup']) {
    window.addEventListener(type, (e) => {
      const k = KEYS[e.key];
      if (!k) return;
      if (e.isTrusted) e.preventDefault();
      $(k.button).classList.toggle('down', type === 'keydown');
    });
  }

  const SKIN_KEY = 'pebbleos-skin-@PBL_PLATFORM_NAME@';
  function setSkin(skin, save = true) {
    $('frame').src = $('shadow').src = skin + '.png';
    for (const s of document.querySelectorAll('.swatch')) {
      s.setAttribute('aria-pressed', String(s.dataset.skin === skin));
    }
    if (save) try { localStorage.setItem(SKIN_KEY, skin); } catch (e) {}
  }
  for (const s of document.querySelectorAll('.swatch')) {
    s.addEventListener('click', () => setSkin(s.dataset.skin));
  }
  {
    let skin = null;
    try { skin = localStorage.getItem(SKIN_KEY); } catch (e) {}
    setSkin(skin in PLATFORM.skins ? skin : Object.keys(PLATFORM.skins)[0], false);
  }

  // A fixed size, with a whole number of device pixels per watch pixel,
  // smaller only when it does not fit. The screen alone fits the box its
  // embedder gives it exactly, whole device pixels or not: snapped, the
  // store's 93px box on a 3x phone gets one device pixel per watch pixel,
  // the face in about three quarters of the box and the rest black.
  function fit() {
    const dpr = window.devicePixelRatio || 1;
    // Embedded, the frame takes the page's height, so only the width counts;
    // the screen alone fills the frame it is given.
    const height = screenOnly ? innerHeight / FH : embedded ? Infinity : (innerHeight - 100) / FH;
    const side = parseFloat(getComputedStyle(document.body).paddingLeft) * 2;
    const room = Math.min(screenOnly ? Infinity : 1.5, (innerWidth - side) / FW, height);
    const k = Math.floor(room * dpr);
    $('watch').style.setProperty('--px', (!screenOnly && k >= 1 ? k / dpr : room) + 'px');
  }
  fit();
  window.addEventListener('resize', fit);

  // The screen's backing store matches its device pixels, and is drawn with
  // square pixels, whatever the zoom.
  new ResizeObserver(([e]) => {
    const dpr = window.devicePixelRatio || 1;
    const w = e.contentRect.width * dpr, h = e.contentRect.height * dpr;
    // Emulated device scales report CSS pixels here.
    const box = e.devicePixelContentBoxSize?.[0];
    const exact = box && Math.abs(box.inlineSize - w) < 1 && Math.abs(box.blockSize - h) < 1;
    screen.width = exact ? box.inlineSize : Math.round(w);
    screen.height = exact ? box.blockSize : Math.round(h);
  }).observe(screen);

  function draw() {
    if (canvas.width && canvas.height) {
      const r = Math.min(screen.width / canvas.width, screen.height / canvas.height);
      const k = r >= 1 && !screenOnly ? Math.round(r) : r;
      const w = canvas.width * k, h = canvas.height * k;
      ctx.imageSmoothingEnabled = r < 1 || k % 1 !== 0;
      ctx.drawImage(canvas, (screen.width - w) >> 1, (screen.height - h) >> 1, w, h);
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  $('reset').addEventListener('click', () => location.reload());
  function showLog(show) {
    const button = $('toggle-log');
    log.hidden = !show;
    button.textContent = show ? 'Hide log' : 'Show log';
    button.setAttribute('aria-expanded', String(show));
    if (show) log.scrollTop = log.scrollHeight;
  }
  $('toggle-log').addEventListener('click', () => showLog(log.hidden));

  // A trap ends the firmware without a word, so say so on the screen.
  let crashed = false;
  function crash(error) {
    if (crashed) return;
    crashed = true;
    print(`\n*** firmware crashed: ${error?.stack || error} ***`);
    const restart = document.createElement('button');
    restart.className = 'text';
    restart.textContent = 'Restart';
    restart.addEventListener('click', () => location.reload());
    const title = document.createElement('strong');
    title.textContent = 'Firmware crashed';
    const detail = document.createElement('small');
    detail.textContent = error?.message || String(error);
    const boot = $('boot');
    boot.classList.remove('done');
    boot.classList.add('crash');
    boot.replaceChildren(title, detail, restart);
    showLog(true);
  }
  window.addEventListener('error', (e) => crash(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => crash(e.reason));

  function print(text) {
    const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
    log.textContent += text + '\n';
    if (log.textContent.length > 200000) log.textContent = log.textContent.slice(-150000);
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  var Module = {
    canvas,
    // The same build's files, whatever the browser has cached.
    locateFile: (path, prefix) =>
      prefix + path + (params.has('v') ? '?v=' + encodeURIComponent(params.get('v')) : ''),
    print,
    printErr: print,
    setStatus: (text) => {
      const m = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      $('boot').textContent = m ? `Loading… ${Math.round(100 * m[1] / m[2])}%` : (text || 'Booting…');
    },
    onAbort: (what) => crash(what),
    onRuntimeInitialized: () => {
      $('boot').classList.add('done');
      // Embedded, focus would scroll the documentation page to the frame.
      if (!embedded) canvas.focus();
      enableApps();
      enableSerial();
    },
  };

  // Apps: a .pbw from a file, dropped on the page or picked, or from a URL,
  // also given as ?pbw= in the page's address.
  function installBytes(bytes, name) {
    print(`Installing ${name}`);
    Module.pbw = bytes;
    Module._samsa_pbw_install_from_page(bytes.length);
    Module.pbw = null;
  }

  async function installUrl(url) {
    try {
      const res = await fetch(url.trim());
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      installBytes(new Uint8Array(await res.arrayBuffer()), url.trim());
    } catch (e) {
      // A host that does not allow other origins looks like a network error.
      print(`Could not install ${url}: ${e.message}`);
      showLog(true);
    }
  }

  async function installFile(file) {
    installBytes(new Uint8Array(await file.arrayBuffer()), file.name);
  }

  function enableApps() {
    if (!Module._samsa_pbw_install_from_page) return;
    if (params.get('pbw')) installUrl(params.get('pbw'));
    if (screenOnly) return;
    $('apps').hidden = false;
    const url = $('app-url');
    // Typing a link must not press the watch's buttons.
    for (const type of ['keydown', 'keyup', 'keypress']) {
      url.addEventListener(type, (e) => {
        e.stopPropagation();
        if (type === 'keydown' && e.key === 'Enter') installUrl(url.value);
      });
    }
    $('app-install').addEventListener('click', () => installUrl(url.value));
    $('app-open').addEventListener('click', () => $('app-file').click());
    $('app-file').addEventListener('change', (e) => {
      for (const file of e.target.files) installFile(file);
      e.target.value = '';
    });
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      document.body.classList.add('drop');
    });
    document.addEventListener('dragleave', () => document.body.classList.remove('drop'));
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      document.body.classList.remove('drop');
      for (const file of e.dataTransfer.files) installFile(file);
    });
  }

  // ?serial: the parent page is the phone. The firmware's QEMU serial bytes
  // go to it as { pblSerial: Uint8Array }, gathered per turn of the event
  // loop; it sends bytes back the same way, and a .pbw as { pblInstall }.
  // { pblReady: true } tells it the frame takes messages; the firmware may
  // still be booting, and holds the bytes until it is up. The watch starts
  // with no phone, so the parent's first message connects one.
  function enableSerial() {
    if (!params.has('serial') || parent === window || !Module._uart_posix_qemu_rx_from_page) return;
    let tx = [];
    Module.onQemuSerial = (c) => {
      if (!tx.length) {
        setTimeout(() => {
          parent.postMessage({ pblSerial: new Uint8Array(tx) }, '*');
          tx = [];
        });
      }
      tx.push(c);
    };
    window.addEventListener('message', (e) => {
      if (e.source !== parent) return;
      if (e.data?.pblSerial instanceof Uint8Array) {
        Module.qemuSerialRx = e.data.pblSerial;
        Module._uart_posix_qemu_rx_from_page(e.data.pblSerial.length);
        Module.qemuSerialRx = null;
      } else if (e.data?.pblInstall instanceof Uint8Array) {
        installBytes(e.data.pblInstall, 'app from the page');
      }
    });
    parent.postMessage({ pblReady: true }, '*');
  }

  if (embedded) {
    window.addEventListener('message', (e) => {
      if (e.source === parent && e.data?.theme) document.documentElement.dataset.theme = e.data.theme;
    });
    new ResizeObserver(() => {
      const height = Math.ceil(document.body.getBoundingClientRect().height);
      parent.postMessage({ pblPlaygroundHeight: height }, '*');
    }).observe(document.body);
  }
</script>

</body>
</html>
