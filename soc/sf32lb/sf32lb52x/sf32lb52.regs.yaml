labels:
  - hpsys_aon
  - hpsys_cfg
  - hpsys_rcc
  - lcpu_ipc
  - lcpu_ipc_ch2
  - lpsys_aon
  - lpsys_rcc
  - pmuc
  - rtc
  - wdt1
