# Blocks the early init and the power-off path touch before there are devices,
# and the memory shared with the LCPU and ACPU, which the MPU maps
config: SOC_SF32LB57
labels:
  - hpsys_aon
  - hpsys_rcc
  - ipc_bufs
  - lcpu_ipc
  - lpsys_aon
  - lpsys_rcc
  - pmuc
  - wdt1
