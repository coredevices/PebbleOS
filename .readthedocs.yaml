# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "3.13"
  apt_packages:
    - doxygen
  jobs:
    post_checkout:
      # The version comes from git describe, which needs the tags and the
      # history down to them
      - git fetch --unshallow --tags || git fetch --tags
      # Skip build if there are no doc changes in a PR
      # Ref. https://docs.readthedocs.com/platform/stable/build-customization.html#cancel-build-based-on-a-condition
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] &&
           git diff --quiet origin/main -- docs/ include/ .readthedocs.yaml;
        then
          exit 183;
        fi
    post_system_dependencies:
      # The playground (docs/_ext/pbl_playground.py) runs the wasm builds of
      # CI: of the native firmware run for main, of the release for a tag.
      # Pull request previews go without. While the builds are not there
      # yet, the build cancels: the Docs Playground RTD workflow starts it
      # again. Custom environment variables are not there until after the
      # checkout jobs.
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" != "external" ] &&
           [ -n "$PBL_PLAYGROUND_GITHUB_TOKEN" ]; then
          rc=0; python3 docs/_scripts/pbl_playground_fetch_rtd.py || rc=$?
          if [ $rc -eq 2 ]; then exit 183; fi
          if [ $rc -ne 0 ] && [ $rc -ne 3 ]; then exit $rc; fi
        fi
    pre_build:
      # Build the Doxygen API reference, published under /apidoc/ via
      # html_extra_path (see docs/conf.py)
      # v2.4.2, pinned by commit
      - git clone https://github.com/jothepro/doxygen-awesome-css.git &&
        git -C doxygen-awesome-css checkout d52eafe3e9303399fda15661f3d7bb8fe3d7eabc
      - PBL_DOCS_VERSION=$(git describe) doxygen docs/_doxygen/Doxyfile.rtd

sphinx:
    configuration: docs/conf.py
    fail_on_warning: true

python:
    install:
      - requirements: docs/requirements.txt 
