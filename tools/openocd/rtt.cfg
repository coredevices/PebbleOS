# Serve RTT channel 0, the console of a build with an RTT console, on a TCP port, after the
# board's configuration. RTT_ADDR is the address of the _SEGGER_RTT control block in the ELF.
# 'pbl debugserver' loads it for builds with RTT, and 'pbl console --rtt' opens the port.
#
# Set RTT_PORT with -c before this file to change the port. The target keeps running.

if {![info exists RTT_ADDR]} {
	error "RTT: set RTT_ADDR to the address of _SEGGER_RTT"
}
if {![info exists RTT_PORT]} {
	set RTT_PORT 9090
}

init
rtt setup $RTT_ADDR 16 "SEGGER RTT"
rtt polling_interval 10

# The firmware sets the control block up as it boots
set _rtt_started 0
for {set i 0} {$i < 50} {incr i} {
	if {![catch {rtt start}]} {
		set _rtt_started 1
		break
	}
	sleep 100
}
if {!$_rtt_started} {
	echo "RTT: no control block found; once the firmware runs, run 'rtt start' (telnet port 4444)"
}

rtt server start $RTT_PORT 0
echo "RTT: console on TCP port $RTT_PORT"
