# Zephyr Kconfig values for the PebbleOS BR/EDR host; gen_config.py turns them
# into zephyr_bt_config.h.

# BR/EDR host with HFP hands-free
CONFIG_BT=y
CONFIG_EXPERIMENTAL=y
CONFIG_BT_CLASSIC=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_HFP_HF=y
# The list of current calls (AT+CLCC), for the number of a call dialed on the phone
CONFIG_BT_HFP_HF_ECS=y
CONFIG_BT_DEVICE_NAME="PT2-ZEPHYR"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
# Service class Audio, major Wearable, minor Wrist Watch
CONFIG_BT_COD=0x200704
CONFIG_BT_DEVICE_APPEARANCE=0

# NimBLE owns LE. BT_CLASSIC selects the LE roles and SMP; gen_config.py drops
# those selects and keeps only LE connections (BT_CONN), which the BR/EDR code
# is built on.
CONFIG_PEBBLE_ZBT=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_BROADCASTER=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_SMP=n
CONFIG_BT_HOST_CRYPTO=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=n
CONFIG_BT_GATT_SERVICE_CHANGED=n

# Nothing that would change controller state shared with NimBLE
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_HCI_VS=n

# One bonded phone. Its link key is kept by the port (ctl/zbt_ctl.c), not by
# Zephyr's settings.
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=n
CONFIG_SETTINGS=n

# All work queues share one thread, see port/src/zbt_kernel.c
CONFIG_BT_TX_PROCESSOR_THREAD=n

# Smaller buffer pools. Events larger than 200 bytes (Remote Name Request
# Complete, Extended Inquiry Result) only follow requests this host does not
# make; the discardable pool is for LE advertising reports, which go to NimBLE.
CONFIG_BT_BUF_EVT_RX_COUNT=3
CONFIG_BT_BUF_EVT_RX_SIZE=200
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_EVT_DISCARDABLE_SIZE=43
CONFIG_BT_BUF_ACL_TX_COUNT=2
# Command completions wait in the ZephyrRX queue now; a second buffer lets the
# next one (or Number Of Completed Packets) in meanwhile.
CONFIG_BT_BUF_SYNC_EVT_POOL_COUNT=2
CONFIG_BT_ATT_TX_COUNT=1

# No logging; asserts park the Zephyr thread, see zbt_fatal()
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_BT_ASSERT_VERBOSE=n

# Phone book access client
CONFIG_BT_PBAP_PCE=y

# Sniff mode: the link idles at the sniff interval instead of every poll
CONFIG_BT_POWER_MODE_CONTROL=y
