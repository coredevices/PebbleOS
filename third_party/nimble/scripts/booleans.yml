#
# The NimBLE options that are flags, and so become Kconfig bools rather than
# ints. Everything not listed here stays an int.
#
# syscfg has no boolean type, and an option's default does not say which it
# is: plenty of counts default to 1 (BLE_MAX_CONNECTIONS,
# BLE_L2CAP_SIG_MAX_PROCS). Nothing in NimBLE's own files distinguishes the
# two either, so this list is maintained by hand and reviewed when the
# submodule moves.
#
# gen_syscfg.py rejects an entry it can prove wrong: one naming an option that
# no longer exists, one with a `range:`, and one that NimBLE's own apps,
# targets or test setups assign a value other than 0 or 1. It cannot prove an
# entry right, so add one only after checking how the option is used.
#
# An option whose value is just another option's (BLE_GATT_READ is
# MYNEWT_VAL_BLE_ROLE_CENTRAL) follows that option's type and does not need
# listing.

