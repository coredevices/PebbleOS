#
# Input to gen_syscfg.py: which NimBLE packages are converted, how they are
# grouped into Kconfig files, and the few options that need a hand-written
# shape. See README.md.

nimble: mynewt-nimble
header: port/include/syscfg/syscfg.h
booleans: booleans.yml

# One Kconfig.<id> file per area. `enable` names a bool the area defines to
# switch its packages on, for those a build can leave out; where it is off,
# the options stay undefined, exactly as they would be for a newt target that
# leaves the package out. `includes` lists areas whose files are sourced from
# inside this one's menu, rather than from the top-level Kconfig.
areas:
  - id: ble
    title: "Core"
    packages:
      - nimble

  - id: host
    title: "Host"
    packages:
      - nimble/host

  - id: svcs
    title: "GATT services"
    packages:
      - nimble/host/services/gap
      - nimble/host/services/gatt
    includes:
      - svc_bas
      - svc_dis

  - id: svc_bas
    title: "Battery Service"
    enable: NIMBLE_BLE_SVC_BAS
    packages:
      - nimble/host/services/bas

  - id: svc_dis
    title: "Device Information Service"
    enable: NIMBLE_BLE_SVC_DIS
    packages:
      - nimble/host/services/dis

  - id: transport
    title: "HCI transport"
    packages:
      - nimble/transport

  - id: controller
    title: "Controller"
    enable: NIMBLE_CONTROLLER
    packages:
      - nimble/controller

  - id: drivers
    title: "nRF5x radio driver"
    enable: NIMBLE_DRIVER_NRF5X
    packages:
      - nimble/drivers/nrf5x
    files:
      - port_nrf.yml

  - id: port
    title: "Porting layer"
    files:
      - port.yml

# NimBLE options whose value is a C macro rather than a number. Listing the
# macros here turns the option into a Kconfig choice; without it the option
# would be fixed at NimBLE's default by the generated header.
overrides:
  BLE_SM_IO_CAP:
    default: NO_INPUT_OUTPUT
    enum:
      DISPLAY_ONLY: BLE_HS_IO_DISPLAY_ONLY
      DISPLAY_YESNO: BLE_HS_IO_DISPLAY_YESNO
      KEYBOARD_ONLY: BLE_HS_IO_KEYBOARD_ONLY
      NO_INPUT_OUTPUT: BLE_HS_IO_NO_INPUT_OUTPUT
      KEYBOARD_DISPLAY: BLE_HS_IO_KEYBOARD_DISPLAY
