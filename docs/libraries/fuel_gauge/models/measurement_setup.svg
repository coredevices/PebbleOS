<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 40 580 275" width="580" height="275">
  <style>
    .f { fill: none; stroke: #8a8a8a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .w { fill: none; stroke: #8a8a8a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .d { fill: none; stroke: #8a8a8a; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .n { fill: #8a8a8a; }
    text { fill: #8a8a8a; font-family: "Latin Modern Roman", "STIX Two Text", "Cambria", "Times New Roman", serif; font-size: 16px; }
    .i { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif; font-style: italic; font-size: 20px; }
    .s { font-size: 13px; }
  </style>

  <!-- cell -->
  <path class="f" d="M200 90 V128 M200 146 V190"/>
  <path class="f" d="M180 128 H220"/>
  <path class="f" d="M191 146 H209" style="stroke-width: 4"/>
  <text x="212" y="122" class="s">+</text>
  <text x="212" y="162" class="s">−</text>
  <text x="168" y="141" text-anchor="end">cell</text>

  <!-- temperature sensor on the cell -->
  <rect class="w" x="228" y="126" width="22" height="22" rx="3"/>
  <text x="239" y="143" text-anchor="middle" class="i" style="font-size: 16px">T</text>
  <path class="d" d="M239 148 V262"/>

  <!-- force path: current sense and charger or load -->
  <path class="f" d="M200 90 H290 M350 90 H440 M200 190 H440"/>
  <rect class="w" x="290" y="78" width="60" height="24" rx="3"/>
  <text x="320" y="96" text-anchor="middle" class="i" style="font-size: 16px">i</text>
  <text x="320" y="68" text-anchor="middle" class="s">current sense</text>
  <path class="d" d="M320 102 V262"/>

  <rect class="w" x="440" y="70" width="130" height="140" rx="4"/>
  <circle class="n" cx="440" cy="90" r="3.5"/>
  <circle class="n" cx="440" cy="190" r="3.5"/>
  <text x="505" y="135" text-anchor="middle">charger</text>
  <text x="505" y="157" text-anchor="middle">or load</text>

  <!-- 4-wire voltage sense at the cell terminals -->
  <circle class="n" cx="200" cy="108" r="3"/>
  <circle class="n" cx="200" cy="172" r="3"/>
  <path class="w" d="M200 108 H90 V118 M200 172 H90 V162"/>
  <circle class="w" cx="90" cy="140" r="22"/>
  <text x="90" y="147" text-anchor="middle" class="i">v</text>
  <text x="90" y="101" text-anchor="middle" class="s">4-wire sense</text>
  <path class="d" d="M90 162 V262"/>

  <!-- logger -->
  <rect class="w" x="50" y="262" width="320" height="40" rx="4"/>
  <text x="210" y="287" text-anchor="middle">logger, about 1 sample/s</text>
</svg>
