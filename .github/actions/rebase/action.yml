name: Rebase onto target branch
description: >
  Check out the PR head and rebase it onto the target branch tip the
  merge ref was created from, so CI runs against up-to-date code and
  every job of a run uses the same base. Fails if the rebase does not apply
  cleanly. The rebase is skipped on non-PR events. Requires a full checkout
  (fetch-depth: 0) of the default (merge) ref, so this action resolves
  from the merged tree regardless of the PR branch contents.

  Submodules are fetched here, shallow and in parallel, rather than by
  actions/checkout, which clones their full history one at a time.

inputs:
  submodules:
    description: >
      Check out submodules after the rebase, at depth 1. Same semantics
      as actions/checkout: 'false', 'true' or 'recursive'.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Rebase onto target branch
      shell: bash
      env:
        SUBMODULES: ${{ inputs.submodules }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          git config --global user.email "ci@repebble.com"
          git config --global user.name "PebbleOS CI"

          rm -rf .git/rebase-apply .git/rebase-merge

          git checkout --force "${HEAD_SHA}"

          # Deterministic committer dates so every job rebasing the same
          # commits onto the same base produces identical commit hashes
          # (e.g. git describe must match across matrix jobs).
          # The merge ref's first parent pins the base for the whole run;
          # origin/<base> may move between jobs.
          base=$(git rev-parse "${GITHUB_SHA}^1")

          if ! git rebase --committer-date-is-author-date "${base}"; then
            git rebase --abort || true
            echo "::error::Cannot rebase onto ${GITHUB_BASE_REF}. Rebase your branch locally, resolve conflicts and push again."
            exit 1
          fi

          git log --oneline -10
        else
          echo "Not a pull request, skipping rebase."
        fi

        case "${SUBMODULES}" in
          recursive)
            git submodule update --init --depth 1 --jobs 8 --recursive ;;
          true)
            git submodule update --init --depth 1 --jobs 8 ;;
        esac
