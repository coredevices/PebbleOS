name: Build Firmware (QEMU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, '*-branch']
  workflow_call:

jobs:
  changes-qemu:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should-build: ${{ github.event_name == 'push' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - '.github/actions/**'
              - '.github/workflows/build-qemu.yml'
              - 'platform/**'
              - 'resources/**'
              - 'sdk/**'
              - 'soc/**'
              - 'src/**'
              - 'stored_apps/**'
              - 'tools/**'
              - 'third_party/**'
              - 'tests/integration/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'Kconfig'

  build-qemu:
    needs: changes-qemu
    if: needs.changes-qemu.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v8

    strategy:
      matrix:
        board: ["qemu_flint", "qemu_emery", "qemu_gabbro"]
        build: ["normal", "prf-itest"]
        include:
          - build: normal
            variant: normal
          - build: prf-itest
            variant: prf
            suffix: -prf-itest
            options: -DCONFIG_BT_HCI_UART=y

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}" 

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Configure
        run: pbl configure --board ${{ matrix.board }} --variant ${{ matrix.variant }} ${{ matrix.options }}

      - name: Build
        run: pbl build qemu_image_micro qemu_image_spi bundle

      - name: Copy artifacts
        run: |
          version=$(git describe)
          mkdir artifacts
          cp build/qemu_micro_flash.bin "artifacts/${{ matrix.board }}${{ matrix.suffix }}_${version}_micro_flash.bin"
          cp build/qemu_spi_flash.bin "artifacts/${{ matrix.board }}${{ matrix.suffix }}_${version}_spi_flash.bin"

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}${{ matrix.suffix }}-qemu
          path: artifacts

      # What the integration tests need of the build, laid out as in build/;
      # the firmware bundle is what the PRF tests install.
      - name: Store integration test build
        uses: actions/upload-artifact@v7
        with:
          name: itest-build-${{ matrix.board }}${{ matrix.suffix }}
          include-hidden-files: true
          retention-days: 3
          path: |
            build/CMakeCache.txt
            build/.config
            build/pebbleos.elf
            build/qemu_micro_flash.bin
            build/qemu_spi_flash.bin
            build/normal_*.pbz

  integration-tests:
    needs: build-qemu
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v8

    strategy:
      fail-fast: false
      matrix:
        board: ["qemu_flint", "qemu_emery", "qemu_gabbro"]
        build: ["normal", "prf-itest"]
        include:
          - build: prf-itest
            suffix: -prf-itest
            options: --qemu-bt-hci virtual --main-build "$GITHUB_WORKSPACE/build-main" -m "not slow"

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase

      - name: Install dependencies
        run: |
          # QEMU links SDL even when run headless.
          apt-get update
          apt-get install -y --no-install-recommends libsdl2-2.0-0
          pip install -U pip
          pip install -r requirements.txt

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: itest-build-${{ matrix.board }}${{ matrix.suffix }}
          path: build

      - name: Download normal build
        if: matrix.build == 'prf-itest'
        uses: actions/download-artifact@v8
        with:
          name: itest-build-${{ matrix.board }}
          path: build-main

      - name: Integration tests
        run: pbl itest --no-build ${{ matrix.options }}

      - name: Publish integration test report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: build/itest/junit.xml
          check_name: Integration tests (${{ matrix.board }}${{ matrix.suffix }})
          annotate_only: true
          detailed_summary: true

      - name: Store integration test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: itest-results-${{ matrix.board }}${{ matrix.suffix }}
          path: build/itest

  build-qemu-status:
    needs: [changes-qemu, build-qemu, integration-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          needs.build-qemu.result == 'failure' ||
          needs.build-qemu.result == 'cancelled' ||
          needs.integration-tests.result == 'failure' ||
          needs.integration-tests.result == 'cancelled'
        run: exit 1
