name: Build Firmware (QEMU)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, '*-branch']
  workflow_call:

jobs:
  changes-qemu:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should-build: ${{ github.event_name == 'push' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - '.github/actions/**'
              - '.github/workflows/build-qemu.yml'
              - 'apps/**'
              - 'boards/**'
              - 'cmake/**'
              - 'drivers/**'
              - 'pebble/**'
              - 'include/**'
              - 'kernel/**'
              - 'lib/**'
              - 'resources/**'
              - 'sdk/**'
              - 'soc/**'
              - 'subsys/**'
              - 'tests/integration/**'
              - 'third_party/**'
              - 'tools/**'
              - 'CMakeLists.txt'
              - 'Kconfig*'
              - 'SDK_VERSION'
              - 'pbl.yml'
              - 'requirements.txt'

  build-qemu:
    needs: changes-qemu
    if: needs.changes-qemu.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v11

    strategy:
      matrix:
        board: ["qemu_flint", "qemu_emery", "qemu_gabbro"]

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: qemu-${{ matrix.board }}-normal

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Configure
        run: pbl configure --board ${{ matrix.board }}

      - name: Build
        run: pbl build qemu_image_micro qemu_image_spi bundle

      - name: Save the compiler cache
        uses: ./.github/actions/ccache-save
        with:
          key: qemu-${{ matrix.board }}-normal

      - name: Copy artifacts
        run: |
          version=$(git describe)
          mkdir artifacts
          cp build/qemu_micro_flash.bin "artifacts/${{ matrix.board }}_${version}_micro_flash.bin"
          cp build/qemu_spi_flash.bin "artifacts/${{ matrix.board }}_${version}_spi_flash.bin"

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}-qemu
          path: artifacts

  # Each test job builds the firmware it runs, so it starts as soon as the
  # changes are known instead of waiting on every build.
  integration-tests:
    needs: changes-qemu
    if: needs.changes-qemu.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v11

    strategy:
      fail-fast: false
      matrix:
        board: ["qemu_flint", "qemu_emery", "qemu_gabbro"]
        build: ["normal-itest", "prf-itest"]
        include:
          - build: normal-itest
            variant: normal
            suffix: -normal-itest
            options: --bt-hci virtual --integration
          - build: prf-itest
            variant: prf
            suffix: -prf-itest
            options: --bt-hci virtual --integration --main-build "$GITHUB_WORKSPACE/build-main"

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: qemu-${{ matrix.board }}-${{ matrix.build }}

      - name: Install dependencies
        run: |
          # QEMU links SDL even when run headless.
          apt-get update
          apt-get install -y --no-install-recommends libsdl2-2.0-0
          pip install -U pip
          pip install -r requirements.txt

      # The PRF tests install the normal firmware bundle.
      - name: Build the normal firmware
        if: matrix.build == 'prf-itest'
        run: |
          pbl -b build-main configure --board ${{ matrix.board }}
          pbl -b build-main build qemu_image_micro qemu_image_spi bundle

      - name: Build
        run: |
          pbl configure --board ${{ matrix.board }} --variant ${{ matrix.variant }} -DCONFIG_BT_HCI_UART=y
          pbl build qemu_image_micro qemu_image_spi bundle

      - name: Save the compiler cache
        uses: ./.github/actions/ccache-save
        with:
          key: qemu-${{ matrix.board }}-${{ matrix.build }}

      - name: Integration tests
        run: pbl itest --no-build -n 4 ${{ matrix.options }}

      - name: Publish integration test report
        uses: mikepenz/action-junit-report@v6
        if: (!cancelled())
        with:
          report_paths: build/itest/junit.xml
          check_name: Integration tests (${{ matrix.board }}${{ matrix.suffix }})
          annotate_only: true
          detailed_summary: true

      - name: Store integration test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: itest-results-${{ matrix.board }}${{ matrix.suffix }}
          path: build/itest

  build-qemu-status:
    needs: [changes-qemu, build-qemu, integration-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          needs.build-qemu.result == 'failure' ||
          needs.build-qemu.result == 'cancelled' ||
          needs.integration-tests.result == 'failure' ||
          needs.integration-tests.result == 'cancelled'
        run: exit 1
