name: Blocking labels

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check for blocking labels
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BLOCKING: '["DNM", "pending:hw-validation", "pending:sdk-review"]'
        run: |
          found=$(jq -nr --argjson l "$LABELS" --argjson b "$BLOCKING" \
            '$l - ($l - $b) | .[]')
          if [ -n "$found" ]; then
            while read -r label; do
              echo "::error::Pull request has blocking label '$label'"
            done <<< "$found"
            exit 1
          fi
