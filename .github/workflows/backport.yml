name: Backport

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    if: >
      github.event.pull_request.merged &&
      contains(toJSON(github.event.pull_request.labels.*.name), '"backport-')
    runs-on: ubuntu-24.04
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.BACKPORT_APP_ID }}
          private-key: ${{ secrets.BACKPORT_APP_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Create backport pull requests
        uses: korthout/backport-action@ad272ff24e4a8593bf18a951a154ae6af93b26b8 # v5.0.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          label_pattern: ^backport-(.+)$
          pull_title: '[Backport ${target_branch}] ${pull_title}'
          pull_description: 'Backport of #${pull_number} to `${target_branch}`.'
