name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, '*-branch']
  workflow_call:
    inputs:
      sbom:
        description: Also generate the software bill of materials
        type: boolean
        default: false

jobs:
  changes-firmware:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should-build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            src:
              - '.github/actions/**'
              - '.github/workflows/build-firmware.yml'
              - 'apps/**'
              - 'boards/**'
              - 'cmake/**'
              - 'drivers/**'
              - 'pebble/**'
              - 'include/**'
              - 'kernel/**'
              - 'lib/**'
              - 'resources/**'
              - 'sdk/**'
              - 'soc/**'
              - 'subsys/**'
              - 'third_party/**'
              - 'tools/**'
              - 'CMakeLists.txt'
              - 'Kconfig*'
              - 'SDK_VERSION'
              - 'pbl.yml'
              - 'requirements.txt'

  build-firmware:
    needs: changes-firmware
    if: needs.changes-firmware.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v13

    strategy:
      matrix:
        board:
          - asterix
          - obelix@dvt
          - obelix@pvt
          - getafix@dvt
          - getafix@dvt2
        slot:
          - 0
          - 1

        exclude:
          - board: "asterix"
            slot: 1

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: firmware-${{ matrix.board }}-slot${{ matrix.slot }}

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Set artifact board name
        id: artifact_board
        run: echo "NAME=$(printf '%s' "$BOARD" | tr @ _)" >> "$GITHUB_OUTPUT"
        env:
          BOARD: ${{ matrix.board }}

      - name: Set slot suffix
        id: slot_suffix
        run: |
          NEEDS_SUFFIX="obelix_dvt obelix_pvt getafix_dvt getafix_dvt2"

          if echo $NEEDS_SUFFIX | grep -wq "${{ steps.artifact_board.outputs.NAME }}"; then
            echo "SLOT_SUFFIX=_slot${{ matrix.slot }}" >> "$GITHUB_OUTPUT"
          else
            echo "SLOT_SUFFIX=" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        run: pbl configure --board '${{ matrix.board }}' -DCONFIG_FIRMWARE_SLOT=${{ matrix.slot }} -DCONFIG_RELEASE=y

      - name: Build
        run: pbl build

      - name: Save the compiler cache
        uses: ./.github/actions/ccache-save
        with:
          key: firmware-${{ matrix.board }}-slot${{ matrix.slot }}

      - name: Bundle
        run: pbl bundle

      - name: SBOM
        if: inputs.sbom
        run: pbl build sbom

      - name: Copy artifacts
        env:
          BOARD: ${{ steps.artifact_board.outputs.NAME }}
          SLOT_SUFFIX: ${{ steps.slot_suffix.outputs.SLOT_SUFFIX }}
        run: |
          pbz=$(ls build/normal_${BOARD}_*.pbz)
          version=$(basename "$pbz" | sed -E "s/^normal_${BOARD}_//; s/(_slot[01])?\.pbz$//")

          mkdir artifacts
          cp "$pbz" artifacts/
          cp build/pebbleos.hex "artifacts/firmware_${BOARD}_${version}${SLOT_SUFFIX}.hex"
          cp build/pebbleos.bin "artifacts/firmware_${BOARD}_${version}${SLOT_SUFFIX}.bin"
          cp build/pebbleos.elf "artifacts/firmware_${BOARD}_${version}${SLOT_SUFFIX}.elf"
          cp build/log.dict.json \
            "artifacts/firmware_${BOARD}_${version}${SLOT_SUFFIX}_loghash_dict.json"
          if [ -f build/pebbleos.cdx.json ]; then
            cp build/pebbleos.cdx.json "artifacts/firmware_${BOARD}_${version}${SLOT_SUFFIX}.cdx.json"
          fi

      - name: Copy translation source
        if: matrix.board == 'asterix'
        run: cp build/pebbleos.pot artifacts/

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.artifact_board.outputs.NAME }}${{ steps.slot_suffix.outputs.SLOT_SUFFIX }}
          path: artifacts

      - name: Get Build ID
        id: build_id
        run: |
          echo "BUILD_ID=$(readelf -n build/pebbleos.elf | sed -n -e 's/^.*Build ID: //p')" >> "$GITHUB_OUTPUT"

      - name: Upload log hash dictionary
        if: ${{ github.event_name != 'pull_request' && github.repository == 'coredevices/PebbleOS' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LOG_HASH_BUCKET_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LOG_HASH_BUCKET_SECRET }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pip install awscli
          aws s3 cp build/log.dict.json \
            "s3://${{ vars.LOG_HASH_BUCKET_NAME }}/${{ steps.build_id.outputs.BUILD_ID }}-${{ github.sha }}-normal.json" \
            --endpoint-url "${{ vars.LOG_HASH_BUCKET_ENDPOINT }}"

  build-itest:
    needs: changes-firmware
    if: needs.changes-firmware.outputs.should-build == 'true'
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/coredevices/pebbleos-docker:v13

    strategy:
      matrix:
        board:
          - getafix@dvt2
          - obelix@pvt

    steps:
      - name: Mark Github workspace as safe
        run: git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Rebase onto target branch
        uses: ./.github/actions/rebase
        with:
          submodules: true

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: itest-${{ matrix.board }}

      - name: Install Python dependencies
        run: |
          pip install -U pip
          pip install -r requirements.txt

      - name: Set artifact board name
        id: artifact_board
        run: echo "NAME=$(printf '%s' "$BOARD" | tr @ _)" >> "$GITHUB_OUTPUT"
        env:
          BOARD: ${{ matrix.board }}

      - name: Configure
        run: pbl configure --board '${{ matrix.board }}'

      - name: Build
        run: pbl build

      - name: Save the compiler cache
        uses: ./.github/actions/ccache-save
        with:
          key: itest-${{ matrix.board }}

      - name: Bundle
        run: pbl bundle

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: itest-build-${{ steps.artifact_board.outputs.NAME }}
          include-hidden-files: true
          retention-days: 30
          path: |
            build/CMakeCache.txt
            build/.config
            build/pebbleos.elf
            build/pebbleos.hex
            build/system_resources.pbpack
            build/log.dict.json
            build/generated/include/devicetree/partitions.h
            build/normal_*.pbz

  # Merge the new POT into the catalogs in pebbleos-translations and let
  # Weblate pull the result. Weblate's own source upload rewrote every catalog
  # on disk, but its approved-only commit policy left those changes
  # uncommitted, so its next rebase failed on unstaged changes. Weblate stays
  # locked from flushing its commits until it has pulled ours, so the two
  # never edit the checkout at the same time.
  sync-translation-source:
    needs: build-firmware
    if: >-
      github.repository == 'coredevices/PebbleOS' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    concurrency:
      group: translation-source
      cancel-in-progress: false
    env:
      WEBLATE_COMPONENT_URL: ${{ vars.WEBLATE_COMPONENT_URL }}
      WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware-asterix
          path: source

      - name: Install gettext and translate-toolkit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet translate-toolkit==3.20.6
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Lock Weblate
        id: lock
        run: |
          weblate() {
            curl --silent --show-error --fail-with-body --proto '=https' \
              --header "Authorization: Token $WEBLATE_TOKEN" \
              --header 'Content-Type: application/json' "$@"
          }
          # A maintainer or a failed merge locked it; leave that for a human.
          weblate "${WEBLATE_COMPONENT_URL}lock/" | jq -e '.locked == false'
          weblate --data '{"lock": true}' "${WEBLATE_COMPONENT_URL}lock/" \
            | jq -e '.locked == true'
          echo locked=true >> "$GITHUB_OUTPUT"

      - name: Push pending Weblate commits
        run: |
          curl --silent --show-error --fail-with-body --proto '=https' \
            --header "Authorization: Token $WEBLATE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"operation": "push"}' \
            "${WEBLATE_COMPONENT_URL}repository/" | jq -e '.result == true'

      - uses: actions/checkout@v7
        with:
          repository: coredevices/pebbleos-translations
          ssh-key: ${{ secrets.TRANSLATIONS_DEPLOY_KEY }}
          path: translations

      - name: Merge the source into the catalogs
        working-directory: translations
        run: |
          sed '/^"POT-Creation-Date:/d' ../source/pebbleos.pot > pebbleos.pot
          catalogs=()
          for catalog in */tintin.po; do
            locale=${catalog%/*}
            # English font-only packs are not translated in Weblate.
            if [[ ${locale,,} =~ ^en([_@-]|$) ]]; then
              continue
            fi
            msgmerge --quiet --previous --update --backup=none \
              --lang="$locale" "$catalog" pebbleos.pot
            catalogs+=("$catalog")
          done
          # Re-wrap the way Weblate writes catalogs; GNU gettext wraps CJK
          # text differently, which would churn every catalog on each sync.
          python3 - "${catalogs[@]}" <<'EOF'
          import sys
          from translate.storage import pypo

          for path in sys.argv[1:]:
              with open(path, "rb") as f:
                  store = pypo.pofile(f)
              for unit in store.units:
                  if not unit.isheader():
                      unit.source = unit.source
                      unit.target = unit.target
              with open(path, "wb") as f:
                  store.serialize(f)
          EOF

      - name: Commit and push the catalogs
        id: push
        working-directory: translations
        env:
          GIT_AUTHOR_NAME: PebbleOS source CI
          GIT_AUTHOR_EMAIL: pebbleos-source-ci@users.noreply.github.com
          GIT_COMMITTER_NAME: PebbleOS source CI
          GIT_COMMITTER_EMAIL: pebbleos-source-ci@users.noreply.github.com
        run: |
          git add pebbleos.pot '*/tintin.po'
          if git diff --cached --quiet; then
            echo "Translation sources are unchanged"
            exit 0
          fi
          git commit --quiet \
            --message 'chore(l10n): update translation sources' \
            --message "From coredevices/PebbleOS@${GITHUB_SHA}."
          git push origin HEAD:main
          echo pushed=true >> "$GITHUB_OUTPUT"

      - name: Pull the catalogs into Weblate
        id: pull
        if: steps.push.outputs.pushed == 'true'
        run: |
          curl --silent --show-error --fail-with-body --proto '=https' \
            --header "Authorization: Token $WEBLATE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"operation": "pull"}' \
            "${WEBLATE_COMPONENT_URL}repository/" | jq -e '.result == true'

      # If the catalogs reached GitHub but Weblate could not pull them, stay
      # locked so translators do not keep editing a stale checkout.
      - name: Unlock Weblate
        if: >-
          always() && steps.lock.outputs.locked == 'true' &&
          (steps.push.outputs.pushed != 'true' || steps.pull.outcome == 'success')
        run: |
          curl --silent --show-error --fail-with-body --proto '=https' \
            --header "Authorization: Token $WEBLATE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"lock": false}' \
            "${WEBLATE_COMPONENT_URL}lock/" | jq -e '.locked == false'

  merge-firmware:
    needs: build-firmware
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        board:
          - obelix_dvt
          - obelix_pvt
          - getafix_dvt
          - getafix_dvt2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-${{ matrix.board }}_slot*

      - name: Merge slot-specific pbz files
        env:
          BOARD: ${{ matrix.board }}
        run: |
          # Version string is embedded in the bundle name (git describe), e.g.
          # normal_obelix_pvt_v4.35.0-2-gdeadbee_slot0.pbz -> v4.35.0-2-gdeadbee.
          version=$(ls firmware-${BOARD}_slot0/normal_${BOARD}_*_slot0.pbz | \
            sed -E "s/^.*normal_${BOARD}_//; s/_slot0\.pbz$//")
          if [ ! -f "firmware-${BOARD}_slot1/normal_${BOARD}_${version}_slot1.pbz" ]; then
            echo "::error::${BOARD} slot1 bundle $(ls firmware-${BOARD}_slot1/*.pbz) does not match slot0 version ${version}"
            exit 1
          fi
          mkdir merged
          python3 tools/merge_pbz.py \
            --slot0-pbz "firmware-${BOARD}_slot0/normal_${BOARD}_${version}_slot0.pbz" \
            --slot1-pbz "firmware-${BOARD}_slot1/normal_${BOARD}_${version}_slot1.pbz" \
            --output "merged/normal_${BOARD}_${version}.pbz"
          cp "firmware-${BOARD}_slot0/firmware_${BOARD}_${version}_slot0_loghash_dict.json" \
            "merged/firmware_${BOARD}_${version}_loghash_dict.json"

      - name: Store
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: merged

  build-firmware-status:
    needs: [changes-firmware, build-firmware, build-itest, merge-firmware]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - if: >-
          needs.build-firmware.result == 'failure' ||
          needs.build-firmware.result == 'cancelled' ||
          needs.build-itest.result == 'failure' ||
          needs.build-itest.result == 'cancelled' ||
          needs.merge-firmware.result == 'failure' ||
          needs.merge-firmware.result == 'cancelled'
        run: exit 1
