source [find interface/cmsis-dap.cfg]
transport select swd

source [find target/nrf52.cfg]

adapter speed 10000
reset_config none

$_TARGETNAME configure -event gdb-attach {
    echo "Halting target because GDB is attaching..."
    halt
}
$_TARGETNAME configure -event gdb-detach {
    echo "Resuming target because GDB is detaching..."
    resume
}

# A soft reset leaves a running watchdog running: reload it, so a flash gets its whole timeout
$_TARGETNAME configure -event reset-end {
    mww 0x40010600 0x6E524635
}
