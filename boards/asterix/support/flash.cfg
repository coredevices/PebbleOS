source [file join [file dirname [info script]] .. .. .. tools openocd nrf52_qspi.tcl]

proc pbl_flash_resources {file offset} {
	nrf52_qspi_init 19 17 20 21 22 23
	nrf52_qspi_write $file $offset
	nrf52_qspi_verify $file $offset
	nrf52_qspi_deinit
}

proc pbl_erase {offset size} {
	nrf52_qspi_init 19 17 20 21 22 23
	nrf52_qspi_erase $offset $size
	nrf52_qspi_deinit
}
