source [find board/stm32h747i-disco.cfg]

# The firmware may leave the core in a low-power state the probe cannot reach
reset_config srst_only srst_nogate connect_assert_srst

$_CHIPNAME.cpu0 configure -event gdb-attach {
    echo "Halting target because GDB is attaching..."
    halt
}
$_CHIPNAME.cpu0 configure -event gdb-detach {
    echo "Resuming target because GDB is detaching..."
    resume
}
