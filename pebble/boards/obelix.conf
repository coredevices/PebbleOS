# Firmware settings for the obelix board.

CONFIG_WATCHDOG=y

CONFIG_MAG=y
CONFIG_PMIC=y
CONFIG_SPEAKER=y
CONFIG_TOUCH=y

CONFIG_ACCEL_LSM6DSO_WK_DUR_DEFAULT=1
CONFIG_ACCEL_LSM6DSO_WK_THS_MIN=1
CONFIG_ACCEL_LSM6DSO_WK_THS_MAX=40
CONFIG_ACCEL_LSM6DSO_WK_THS_DEFAULT=16
CONFIG_ACCEL_LSM6DSO_SCALE_MG=4000

CONFIG_ALS_SCREEN_COMPENSATION=y
# Upper-left edge; black_scale ~12x from `als curve`.
CONFIG_ALS_SENSOR_X=0
CONFIG_ALS_SENSOR_Y=0
CONFIG_ALS_SENSOR_W=40
CONFIG_ALS_SENSOR_H=80
CONFIG_ALS_BLACK_SCALE_Q8=3072

CONFIG_DYNAMIC_BACKLIGHT=y
CONFIG_ACCEL_SENSITIVITY=y
CONFIG_APP_SCALING=y
CONFIG_ORIENTATION_MANAGER=y

CONFIG_SERVICE_LIGHT_BACKLIGHT_ON_PERCENT=45
CONFIG_SERVICE_LIGHT_DARK_THRESHOLD=800
CONFIG_SERVICE_LIGHT_DARK_THRESHOLD_DELTA=100
CONFIG_SERVICE_LIGHT_BACKLIGHT_DEFAULT_COLOR=0xFFBFA2
CONFIG_SERVICE_BATTERY_LOW_POWER_PERCENT=4
CONFIG_SERVICE_BATTERY_CAPACITY_HOURS=400

CONFIG_HRM=y
CONFIG_HRM_GH3X2X=y
CONFIG_HRM_HRV=y
