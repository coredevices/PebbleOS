# Firmware settings for the qemu_emery board.

CONFIG_GPIO=y
CONFIG_WATCHDOG=y

CONFIG_SPEAKER=y
CONFIG_TOUCH=y

# Emulated over the QEMU serial protocol.
CONFIG_ACCEL_QEMU=y

CONFIG_APP_SCALING=y
CONFIG_MODDABLE_XS=y

CONFIG_SERVICE_ACCEL_MANAGER_DEFAULT_SENSITIVITY=85

CONFIG_HRM=y

CONFIG_BT_VENDOR_NAME="QEMU"
