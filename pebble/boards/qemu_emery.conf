# Firmware settings for the qemu_emery board.

CONFIG_PLATFORM_EMERY=y

CONFIG_WATCHDOG=y

CONFIG_QEMU_SERIAL=y

CONFIG_SPEAKER=y
CONFIG_TOUCH=y

CONFIG_APP_SCALING=y
CONFIG_ORIENTATION_MANAGER=y

CONFIG_SERVICE_ACCEL_MANAGER_DEFAULT_SENSITIVITY=85

CONFIG_HRM=y

CONFIG_SERVICE_BLUETOOTH_VENDOR_NAME="QEMU"
