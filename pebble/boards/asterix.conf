# Firmware settings for the asterix board.

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_PWM=y
CONFIG_SPI=y
CONFIG_SPI_MEM=y

CONFIG_FLASH_SPI_NOR=y
CONFIG_MAG=y
CONFIG_MFD=y
CONFIG_OTP_FLASH=y
CONFIG_PMIC=y
CONFIG_SPEAKER=y

CONFIG_AMBIENT_LIGHT_OPT3001_ALWAYS_ON=y

CONFIG_ACCEL_LSM6DSO_WK_DUR_DEFAULT=1
CONFIG_ACCEL_LSM6DSO_WK_THS_MIN=1
CONFIG_ACCEL_LSM6DSO_WK_THS_MAX=40
CONFIG_ACCEL_LSM6DSO_WK_THS_DEFAULT=16
CONFIG_ACCEL_LSM6DSO_SCALE_MG=4000

CONFIG_MFG_SPEAKER_GAIN_MDB=0

CONFIG_ACCEL_SENSITIVITY=y
CONFIG_ORIENTATION_MANAGER=y

CONFIG_SERVICE_LIGHT_BACKLIGHT_ON_PERCENT=17
CONFIG_SERVICE_LIGHT_DARK_THRESHOLD=100
CONFIG_SERVICE_LIGHT_DARK_THRESHOLD_DELTA=30
CONFIG_SERVICE_BATTERY_CAPACITY_HOURS=450
