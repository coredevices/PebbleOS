# System fonts. A .pbf face is used as it is; the font options only
# shape the faces rendered from a .ttf.
media:

  - name: FONT_FALLBACK_INTERNAL
    type: font
    file: GOTHIC_14.pbf
    builtin: true

  - name: GOTHIC_18_BOLD
    type: font
    file: GOTHIC_18_BOLD.pbf
    extended: true

