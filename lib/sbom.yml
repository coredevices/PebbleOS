# Third-party code kept in the library tree, see docs/development/sbom.md.

components:
  - name: egnite-mktime
    path: c/time/mktime.c
    supplier: egnite Software GmbH
    description: mktime() from Nut/OS
    license: BSD-3-Clause

  - name: snprintf
    path: c/newlib/vsnprintf.c
    supplier: Patrick Powell, Holger Weiss
    description: portable snprintf implementation, with Pebble changes
    license: LicenseRef-snprintf-Powell
    url: http://www.jhweiss.de/software/snprintf.html

  - name: utf8-decoder
    paths: [util/utf8.c, ../include/pbl/util/utf8.h]
    supplier: Bjoern Hoehrmann
    description: Flexible and Economical UTF-8 Decoder
    license: MIT
    url: https://bjoern.hoehrmann.de/utf-8/decoder/dfa/
